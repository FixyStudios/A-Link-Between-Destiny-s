// ===== v26: auditoria ampla e correção de colisões =====
(function(){
  'use strict';
  const TILE=16;
  // ',' também é uma parede: aparece em divisórias e pilares do mapa.
  const SOLID_TILES='#~HhdF';
  const decoList=()=>window.__LBD_V16_DECO__||[];
  const overlap=(ax,ay,aw,ah,bx,by,bw,bh)=>
    ax<bx+bw && bx<ax+aw && ay<by+bh && by<ay+ah;

  function tileBlocked(x,y,w,h){
    if(!G)return false;
    const c0=Math.floor(x/TILE), c1=Math.floor((x+w-1)/TILE);
    const r0=Math.floor(y/TILE), r1=Math.floor((y+h-1)/TILE);
    for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
      // Células fora do mapa permanecem livres para permitir as saídas entre salas.
      if(c>=0&&r>=0&&c<W&&r<H&&G[r]&&SOLID_TILES.includes(G[r][c]))return true;
    }
    return false;
  }

  function decoBlocked(x,y,w,h){
    for(const r of (window.__PXR||[]))if(overlap(x,y,w,h,r[0],r[1],r[2],r[3]))return true;
    for(const d of decoList()){
      if(!d||d.m!==S.map)continue;
      // A parede rachada deixa de ser sólida assim que a bomba a destrói.
      if(d.k==='crack'&&d.id&&S.f&&S.f[d.id+'_x'])continue;
      const boxes={
        pillar:[3,0,10,16], statue:[1,0,14,16], totem:[4,0,8,16],
        tomb:[4,2,8,13], mono:[2,1,12,15], crack:[0,0,16,16],
        tstone:[4,2,8,14], altar:[2,1,12,13], camp:[3,6,10,10]
      };
      const b=boxes[d.k];
      if(!b)continue;
      if(overlap(x,y,w,h,d.c*TILE+b[0],d.r*TILE+b[1],b[2],b[3]))return true;
    }
    return false;
  }

  function entityBox(e){
    if(!e||e.dead)return null;
    if(e.k==='torch')return [e.x+3,e.y+1,10,15];
    if(e.k==='pushblock')return [e.x+1,e.y+1,14,14];
    if(e.k==='n'&&e.sign)return [e.x+5,e.y+8,6,10]; // poste da placa
    if(e.k==='n'||e.k==='c'||e.k==='bush')return [e.x+2,e.y+2,12,12];
    return null;
  }

  function entitiesBlocked(x,y,w,h,ignore){
    if(!ents)return false;
    for(const e of ents){
      if(e===ignore)continue;
      if(e.k==='n'&&e.sign&&window.__signRects){if(window.__signRects(e).some(r=>overlap(x,y,w,h,r[0],r[1],r[2],r[3])))return true;continue}
      const b=entityBox(e);
      if(b&&overlap(x,y,w,h,b[0],b[1],b[2],b[3]))return true;
    }
    return false;
  }

  window.__LBD_DECO_BLOCKED__=decoBlocked;
  function playerBlocked(px0,py0){
    const x=px0+3,y=py0+6,w=10,h=9;
    return tileBlocked(x,y,w,h)||decoBlocked(x,y,w,h)||entitiesBlocked(x,y,w,h,null);
  }

  // Colisão estática usada também por inimigos e projéteis.
  function worldBlocked(x,y,w,h,ignoreEntity,includeActors=false){
    if(tileBlocked(x,y,w,h)||decoBlocked(x,y,w,h))return true;
    if(includeActors&&entitiesBlocked(x,y,w,h,ignoreEntity))return true;
    if(!ents)return false;
    for(const e of ents){
      if(e===ignoreEntity||!e||e.dead)continue;
      if(e.k!=='torch'&&e.k!=='pushblock')continue;
      const b=entityBox(e);
      if(b&&overlap(x,y,w,h,b[0],b[1],b[2],b[3]))return true;
    }
    return false;
  }

  function findFreePlayer(x0,y0){
    let best=null,bd=Infinity;
    for(let r=1;r<H-1;r++)for(let c=1;c<W-1;c++){
      const x=c*TILE+1,y=r*TILE-4;
      if(playerBlocked(x,y))continue;
      const d=(x-x0)*(x-x0)+(y-y0)*(y-y0);
      if(d<bd){bd=d;best=[x,y]}
    }
    return best;
  }

  function relocatePlayerIfEmbedded(){
    if(!S||!G||!playerBlocked(px,py))return;
    const p=findFreePlayer(px,py);
    if(p){px=p[0];py=p[1];moving=0}
  }

  // Percorre a trajetória em passos de no máximo 1 px: evita atravessar
  // obstáculos em empurrões, repulsões e golpes com deslocamento maior.
  function tracePlayer(x0,y0,x1,y1){
    let x=x0,y=y0;
    const dx=x1-x0,nx=Math.ceil(Math.abs(dx));
    if(nx){const step=dx/nx;for(let i=0;i<nx;i++){
      if(playerBlocked(x+step,y))break;
      x+=step;
    }}
    const dy=y1-y0,ny=Math.ceil(Math.abs(dy));
    if(ny){const step=dy/ny;for(let i=0;i<ny;i++){
      if(playerBlocked(x,y+step))break;
      y+=step;
    }}
    return [x,y];
  }

  function enemyRect(e){
    if(e.k==='B'||e.k==='MB')return [e.x,e.y,24,24];
    return [e.x+2,e.y+4,12,10];
  }
  function enemyIsMovingEntity(e){
    return !!e&& !e.dead && (e.k==='e'||e.k==='e2'||e.k==='e3'||e.k==='e4'||e.k==='B'||e.k==='MB'||!!e.v||e.k==='baba'||e.k==='scrub'||e.k==='gohma');
  }
  function fixEnemyOverlap(snap){
    if(!ents)return;
    for(const item of snap){
      const e=item.e;
      if(!ents.includes(e)||e.dead)continue;
      const b=enemyRect(e);
      if(!worldBlocked(b[0],b[1],b[2],b[3],e))continue;
      const old=enemyRect({ ...e, x:item.x, y:item.y });
      if(!worldBlocked(old[0],old[1],old[2],old[3],e)){
        e.x=item.x;e.y=item.y;continue;
      }
      // Se já nasceu dentro de um obstáculo, procura uma célula livre próxima.
      let best=null,bd=Infinity;
      for(let r=1;r<H-1;r++)for(let c=1;c<W-1;c++){
        const x=c*TILE,y=r*TILE-4;
        if(worldBlocked(x+2,y+4,12,10,e))continue;
        const d=(x-e.x)*(x-e.x)+(y-e.y)*(y-e.y);
        if(d<bd){bd=d;best=[x,y]}
      }
      if(best){e.x=best[0];e.y=best[1]}
      else{e.x=item.x;e.y=item.y}
    }
  }

  function projectileHitsWall(p){
    const vx=p.vx||0,vy=p.vy||0;
    const steps=Math.max(1,Math.ceil(Math.max(Math.abs(vx),Math.abs(vy))));
    for(let i=0;i<=steps;i++){
      const t=i/steps;
      if(worldBlocked(p.x-3+vx*t,p.y-3+vy*t,6,6,null))return true;
    }
    return false;
  }

  // Blocos empurráveis não podem entrar em pilares, baús, NPCs, tochas ou outros blocos.
  const previousDoA=doA;
  doA=function(){
    const fx=px+8+[0,0,-12,12][dir],fy=py+8+[12,-12,0,0][dir];
    const block=ents&&ents.find(e=>e.k==='pushblock'&&Math.abs(e.x+8-fx)<14&&Math.abs(e.y+8-fy)<14);
    if(block&&!(S.pz&&S.pz[block.pz.id])){
      const nx=block.x+[0,0,-1,1][dir]*TILE;
      const ny=block.y+[1,-1,0,0][dir]*TILE;
      if(worldBlocked(nx+2,ny+4,12,10,block,true)){
        fl('Há um obstáculo impedindo o bloco.');
        return;
      }
    }
    // Não fecha uma porta sobre o próprio Link ao desligar a alavanca.
    const sw=ents&&ents.find(e=>e.k==='switch'&&Math.abs(e.x+8-fx)<14&&Math.abs(e.y+8-fy)<14);
    if(sw&&sw.pz&&S.pz&&S.pz[sw.pz.id]){
      const p=sw.pz;
      for(let r=p.by;r<p.by+p.bh;r++)for(let c=p.bx;c<p.bx+p.bw;c++){
        if(overlap(px+3,py+6,10,9,c*TILE,r*TILE,TILE,TILE)){
          fl('Afaste-se da passagem antes de fechar a alavanca.');
          return;
        }
      }
    }
    return previousDoA.apply(this,arguments);
  };

  const previousUpdate=upd;
  upd=function(){
    const transitioning=!!(window.__TR15&&window.__TR15.active);
    if(S&&(pm||dlg||S.mp||S.invUI||S.ql)&&!transitioning)return;
    if(!S||title||endd)return previousUpdate();

    const oldMap=S.map;
    // Corrige um nascimento/interseção provocada por troca de sala ou puzzle.
    if(!transitioning)relocatePlayerIfEmbedded();
    const oldX=px,oldY=py;

    const enemySnap=ents?ents.filter(enemyIsMovingEntity).map(e=>({e,x:e.x,y:e.y})):[];
    // Projéteis param na primeira parede/obstáculo em vez de atravessarem o cenário.
    if(pj&&pj.length)pj=pj.filter(p=>!projectileHitsWall(p));

    previousUpdate();

    // Uma transição real já executou load(); valida o ponto de chegada no novo mapa.
    if(!S)return;
    if(S.map!==oldMap){relocatePlayerIfEmbedded();return}
    if(title||endd)return;

    const targetX=px,targetY=py;
    const safe=tracePlayer(oldX,oldY,targetX,targetY);
    px=safe[0];py=safe[1];
    fixEnemyOverlap(enemySnap);
    // Remove tiros recém-criados que já nascem dentro de paredes.
    if(pj&&pj.length)pj=pj.filter(p=>!worldBlocked(p.x-3,p.y-3,6,6,null));
  };

  window.__LBD_V26__=true;
  
})();

// One outer canvas save/restore contains every legacy draw wrapper and its clips/compositing.
(function(){
  const save0=g.save.bind(g),restore0=g.restore.bind(g);
  let depth=0,floor=0;
  g.save=function(){save0();depth++};
  g.restore=function(){if(depth>floor){restore0();depth--}};
  const previousDraw=draw;
  draw=function(){
    const base=depth;
    save0();depth++;floor=depth;
    try{previousDraw()}

// Replace the v4/v9 chained interceptors with one per-AudioContext master bus.
(function(){
  const native=window.__LBD_AUDIO_CONNECT_NATIVE__;
  if(!native||AudioNode.prototype.__lbdUnifiedConnect)return;
  const buses=new WeakMap();
  function busFor(ctx){
    let bus=buses.get(ctx);if(bus)return bus;
    const input=ctx.createGain(),dry=ctx.createGain(),conv=ctx.createConvolver(),
          wet=ctx.createGain(),comp=ctx.createDynamicsCompressor();
    const length=Math.max(1,Math.floor(ctx.sampleRate*.65)),ir=ctx.createBuffer(2,length,ctx.sampleRate);
    for(let ch=0;ch<2;ch++){
      const data=ir.getChannelData(ch);
      for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/length,3);
    }
    conv.buffer=ir;dry.gain.value=.92;wet.gain.value=.12;
    comp.threshold.value=-18;comp.ratio.value=3.5;comp.attack.value=.004;comp.release.value=.18;
    native.call(input,dry);native.call(dry,comp);
    native.call(input,conv);native.call(conv,wet);native.call(wet,comp);
    native.call(comp,ctx.destination);
    bus=input;buses.set(ctx,bus);
    ctx.__LBD_MASTER_BUS__=bus;ctx.__b={i:bus,w:wet};ctx.__bus=bus;
    return bus;
  }

    const ctx=this.context;
