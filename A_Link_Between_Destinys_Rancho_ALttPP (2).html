kiri: Tudo bem... vou me esconder.":["Kokiri Child: All right... I'll hide.","Niño Kokiri: Está bien... me esconderé.","コキリの子：わかった……隠れているね。"],"Criança Kokiri: Você está com medo?":["Kokiri Child: Are you afraid?","Niño Kokiri: ¿Tienes miedo?","コキリの子：怖いの？"],"Criança Kokiri: ...Eu também estou.":["Kokiri Child: ...I am too.","Niño Kokiri: ...Yo también.","コキリの子：……ぼくもだよ。"],"Criança Kokiri: Você é incrível!":["Kokiri Child: You're amazing!","Niño Kokiri: ¡Eres increíble!","コキリの子：きみってすごい！"],"Criança Kokiri: A floresta está mais calma, obrigada!":["Kokiri Child: The forest is calmer now, thank you!","Niño Kokiri: ¡El bosque está más tranquilo, gracias!","コキリの子：森が静かになったよ、ありがとう！"],"Ainda há monstros por aí.":["There are still monsters around.","Todavía hay monstruos por ahí.","まだモンスターが残っている。"],"A Forja Goron":["The Goron Forge","La Forja Goron","ゴロンの鍛冶場"],"Goron Ferreiro: Hmph! Os monstros devoram meu carvão.":["Goron Smith: Hmph! Monsters are devouring my coal.","Herrero Goron: ¡Hmph! Los monstruos devoran mi carbón.","ゴロンの鍛冶屋：ふん！モンスターどもがわしの炭を食い荒らしている。"],"Goron Ferreiro: Derrote 6 e eu forjo algo especial.":["Goron Smith: Defeat 6 and I'll forge something special.","Herrero Goron: Derrota a 6 y forjaré algo especial.","ゴロンの鍛冶屋：6体倒してくれ。特別なものを鍛えてやろう。"],"Goron Ferreiro: Hah! Volte quando terminar.":["Goron Smith: Hah! Come back when you're done.","Herrero Goron: ¡Ja! Vuelve cuando hayas terminado.","ゴロンの鍛冶屋：ハハッ！終わったら戻ってこい。"],"Goron Ferreiro: Hmph. A forja continua fria.":["Goron Smith: Hmph. The forge is still cold.","Herrero Goron: Hmph. La forja sigue fría.","ゴロンの鍛冶屋：ふん。鍛冶場はまだ冷えたままだ。"],"Goron Ferreiro: Pensando demais? Gorons agem primeiro!":["Goron Smith: Thinking too much? Gorons act first!","Herrero Goron: ¿Piensas demasiado? ¡Los Goron actúan primero!","ゴロンの鍛冶屋：考えすぎか？ゴロンはまず行動するんだ！"],"Goron Ferreiro: Hora da forja!":["Goron Smith: Time to forge!","Herrero Goron: ¡Hora de forjar!","ゴロンの鍛冶屋：さあ、鍛造の時間だ！"],"Goron Ferreiro: Que a lâmina te sirva bem!":["Goron Smith: May the blade serve you well!","Herrero Goron: ¡Que la hoja te sirva bien!","ゴロンの鍛冶屋：その刃が役に立つことを願うぞ！"],"A forja espera.":["The forge is waiting.","La forja espera.","鍛冶場で待っているぞ。"],"A Rede Perdida":["The Lost Net","La Red Perdida","失われた網"],"Pescador Zora: Perdi minha rede rio abaixo...":["Zora Fisherman: I lost my net downstream...","Pescador Zora: Perdí mi red río abajo...","ゾーラの漁師：川の下流で網をなくしてしまった……"],"Pescador Zora: Dê uma olhada no Rio Zora, ao leste, e me conte.":["Zora Fisherman: Take a look along the Zora River to the east and tell me what you find.","Pescador Zora: Echa un vistazo al Río Zora, al este, y dime qué encuentras.","ゾーラの漁師：東のゾーラ川を調べて、何があったか教えてくれ。"],"Pescador Zora: Que as águas te guiem!":["Zora Fisherman: May the waters guide you!","Pescador Zora: ¡Que las aguas te guíen!","ゾーラの漁師：水が君を導きますように！"],"Pescador Zora: Sem pressa... a rede não vai a lugar algum.":["Zora Fisherman: No rush... the net isn't going anywhere.","Pescador Zora: Sin prisa... la red no se irá a ninguna parte.","ゾーラの漁師：急がなくていい……網は逃げたりしないさ。"],"Pescador Zora: É um passeio curto, prometo.":["Zora Fisherman: It's a short trip, I promise.","Pescador Zora: Es un viaje corto, te lo prometo.","ゾーラの漁師：すぐそこだよ、約束する。"],"Pescador Zora: Ah, ela está lá! Obrigado!":["Zora Fisherman: Ah, there it is! Thank you!","Pescador Zora: ¡Ah, ahí está! ¡Gracias!","ゾーラの漁師：ああ、あったぞ！ありがとう！"],"Pescador Zora: O rio está em paz.":["Zora Fisherman: The river is at peace.","Pescador Zora: El río está en paz.","ゾーラの漁師：川に平和が戻った。"],"Recado no Deserto":["Message in the Desert","Mensaje en el Desierto","砂漠の伝言"],"Mensageiro Gerudo: Preciso que alguém leve um recado ao capitão, no extremo leste do deserto.":["Gerudo Messenger: I need someone to deliver a message to the captain at the far eastern edge of the desert.","Mensajero Gerudo: Necesito que alguien lleve un mensaje al capitán, en el extremo este del desierto.","ゲルドの伝令：砂漠の最東端にいる隊長へ伝言を届ける者が必要だ。"],"Mensageiro Gerudo: Diga a ele: 'a tempestade vem'.":["Gerudo Messenger: Tell him: 'the storm is coming.'","Mensajero Gerudo: Dile: «se acerca la tormenta».","ゲルドの伝令：隊長に「嵐が来る」と伝えてくれ。"],"Mensageiro Gerudo: Então encontrarei outro.":["Gerudo Messenger: Then I'll find someone else.","Mensajero Gerudo: Entonces buscaré a otra persona.","ゲルドの伝令：ならば他の者を探すとしよう。"],"Mensageiro Gerudo: Ninguém mais quer cruzar a areia hoje.":["Gerudo Messenger: No one else wants to cross the sand today.","Mensajero Gerudo: Nadie más quiere cruzar la arena hoy.","ゲルドの伝令：今日は誰も砂漠を渡りたがらない。"],"Mensageiro Gerudo: O capitão agradeceu, soube.":["Gerudo Messenger: I heard the captain was grateful.","Mensajero Gerudo: Me dijeron que el capitán estaba agradecido.","ゲルドの伝令：隊長が感謝していたと聞いたよ。"],"Capitão Gerudo: Não esperava ninguém.":["Gerudo Captain: I wasn't expecting anyone.","Capitán Gerudo: No esperaba a nadie.","ゲルドの隊長：誰か来るとは思っていなかった。"],"Capitão Gerudo: 'A tempestade vem'... Entendido! Tome.":["Gerudo Captain: 'The storm is coming'... Understood! Here, take this.","Capitán Gerudo: «Se acerca la tormenta»... ¡Entendido! Toma.","ゲルドの隊長：「嵐が来る」か……了解した！これを持っていけ。"],"Leve o recado ao capitão (extremo leste).":["Deliver the message to the captain (far east).","Lleva el mensaje al capitán (extremo este).","隊長に伝言を届けよう（東の果て）。"],"Cristal Distante":["Distant Crystal","Cristal Distante","遠くの水晶"],"Explorador: Há um salão de cristais a sudeste daqui.":["Explorer: There's a crystal hall to the southeast of here.","Explorador: Hay una sala de cristales al sureste de aquí.","探検家：ここから南東に水晶の広間がある。"],"Explorador: Confirma se ainda brilha?":["Explorer: Can you confirm whether it still shines?","Explorador: ¿Puedes confirmar si todavía brilla?","探検家：まだ輝いているか確かめてくれないか？"],"Explorador: Boa sorte nas trevas!":["Explorer: Good luck in the darkness!","Explorador: ¡Buena suerte en la oscuridad!","探検家：暗闇で気をつけて！"],"Explorador: Escuro demais, né? Entendo.":["Explorer: Too dark, huh? I understand.","Explorador: Demasiado oscuro, ¿eh? Lo entiendo.","探検家：暗すぎるよな？わかるよ。"],"Explorador: As cavernas só assustam por fora.":["Explorer: Caves are only frightening from the outside.","Explorador: Las cuevas solo asustan por fuera.","探検家：洞窟は外から見ると怖いだけさ。"],"Explorador: Ainda brilha! Que alívio.":["Explorer: It still shines! What a relief.","Explorador: ¡Todavía brilla! Qué alivio.","探検家：まだ輝いている！よかった。"],"Explorador: Os cristais me inspiram.":["Explorer: The crystals inspire me.","Explorador: Los cristales me inspiran.","探検家：水晶を見ると創作意欲が湧くよ。"],"Visite o salão a sudeste (mapa 3-8).":["Visit the hall to the southeast (map 3-8).","Visita la sala al sureste (mapa 3-8).","南東の広間を訪れよう（マップ3-8）。"],"Fúria Vulcânica":["Volcanic Fury","Furia Volcánica","火山の怒り"],"Anciã Goron: O vulcão enlouqueceu os monstros.":["Goron Elder: The volcano has driven the monsters mad.","Anciana Goron: El volcán ha enloquecido a los monstruos.","ゴロンの長老：火山のせいでモンスターたちが凶暴になってしまった。"],"Anciã Goron: Elimine 8 e te recompenso.":["Goron Elder: Defeat 8 and I'll reward you.","Anciana Goron: Elimina a 8 y te recompensaré.","ゴロンの長老：8体倒してくれれば褒美をやろう。"],"Anciã Goron: Cuidado com o calor.":["Goron Elder: Beware of the heat.","Anciana Goron: Cuidado con el calor.","ゴロンの長老：熱さに気をつけな。"],"Anciã Goron: Os jovens de hoje...":["Goron Elder: Young people these days...","Anciana Goron: Los jóvenes de hoy...","ゴロンの長老：まったく、最近の若者は……"],"Anciã Goron: Coragem também se treina.":["Goron Elder: Courage can be trained, too.","Anciana Goron: El valor también se entrena.","ゴロンの長老：勇気も鍛えられるものさ。"],"Anciã Goron: Você é digno!":["Goron Elder: You are worthy!","Anciana Goron: ¡Eres digno!","ゴロンの長老：お前には資格がある！"],"Anciã Goron: O vulcão dorme mais tranquilo.":["Goron Elder: The volcano sleeps more peacefully now.","Anciana Goron: El volcán duerme más tranquilo.","ゴロンの長老：火山も今は穏やかに眠っている。"],"O vulcão ainda ruge.":["The volcano is still roaring.","El volcán todavía ruge.","火山はまだ唸り続けている。"],"O Viajante Faminto":["The Hungry Traveler","El Viajero Hambriento","空腹の旅人"],"Viajante Faminto: Por favor... tenho fome. Pode me dar 30 rupees?":["Hungry Traveler: Please... I'm hungry. Could you spare 30 rupees?","Viajero Hambriento: Por favor... tengo hambre. ¿Puedes darme 30 rupias?","腹ペコの旅人：お願いだ……腹が減っている。30ルピー恵んでくれないか？"],"Viajante Faminto: Que a Deusa te abençoe!":["Hungry Traveler: May the Goddess bless you!","Viajero Hambriento: ¡Que la Diosa te bendiga!","腹ペコの旅人：女神のご加護がありますように！"],"Viajante Faminto: ...Entendo.":["Hungry Traveler: ...I understand.","Viajero Hambriento: ...Lo entiendo.","腹ペコの旅人：……わかった。"],"Viajante Faminto: Não precisa decidir agora.":["Hungry Traveler: You don't have to decide now.","Viajero Hambriento: No tienes que decidir ahora.","腹ペコの旅人：今すぐ決めなくてもいい。"],"Viajante Faminto: Nunca esquecerei sua bondade.":["Hungry Traveler: I will never forget your kindness.","Viajero Hambriento: Nunca olvidaré tu bondad.","腹ペコの旅人：あなたの親切は決して忘れない。"],"Ele te entrega um Elixir de Defesa como agradecimento.":["He gives you a Defense Elixir as thanks.","Te entrega un Elixir de Defensa como agradecimiento.","お礼に防御のエリクサーを渡してくれた。"],"Guardiões do Céu":["Guardians of the Sky","Guardianes del Cielo","空の守護者たち"],"Cidadã das Nuvens: Criaturas sombrias rondam nossas ilhas.":["Cloud Citizen: Shadow creatures are prowling around our islands.","Ciudadana de las Nubes: Criaturas sombrías merodean por nuestras islas.","雲の住人：影の怪物たちが島の周りをうろついている。"],"Cidadã das Nuvens: Derrote 5 e abriremos o tesouro da vila.":["Cloud Citizen: Defeat 5 and we'll open the village treasure.","Ciudadana de las Nubes: Derrota a 5 y abriremos el tesoro de la aldea.","雲の住人：5体倒してくれれば、村の宝を開けましょう。"],"Cidadã das Nuvens: O céu confia em você!":["Cloud Citizen: The sky trusts you!","Ciudadana de las Nubes: ¡El cielo confía en ti!","雲の住人：空はあなたを信じています！"],"Cidadã das Nuvens: Voltarei a pedir, se precisar.":["Cloud Citizen: I'll ask again if I need to.","Ciudadana de las Nubes: Volveré a pedírtelo si hace falta.","雲の住人：必要ならまたお願いするわ。"],"Cidadã das Nuvens: O céu é alto, mas você é capaz.":["Cloud Citizen: The sky is high, but you are capable.","Ciudadana de las Nubes: El cielo es alto, pero tú puedes.","雲の住人：空は高いけれど、あなたならできる。"],"Cidadã das Nuvens: As ilhas respiram de novo!":["Cloud Citizen: The islands can breathe again!","Ciudadana de las Nubes: ¡Las islas respiran de nuevo!","雲の住人：島々に再び息吹が戻ったわ！"],"Cidadã das Nuvens: Voe em paz, herói.":["Cloud Citizen: Fly in peace, hero.","Ciudadana de las Nubes: Vuela en paz, héroe.","雲の住人：安らかに飛び立って、勇者よ。"],"Guardiã Alada: Leve esta pena a Ciel, na Ilha do canto sul-leste.":["Winged Guardian: Take this feather to Ciel, on the island in the southeast corner.","Guardiana Alada: Lleva esta pluma a Ciel, en la isla de la esquina sureste.","翼の守り手：この羽根を南東の島にいるシエルへ届けて。"],"Guardiã Alada: Ela entenderá.":["Winged Guardian: She will understand.","Guardiana Alada: Ella lo entenderá.","翼の守り手：きっとわかってくれる。"],"Guardiã Alada: Que pena...":["Winged Guardian: What a pity...","Guardiana Alada: ¡Qué pena...!","翼の守り手：残念だわ……"],"Guardiã Alada: A pena é leve. O recado, não.":["Winged Guardian: The feather is light. The message is not.","Guardiana Alada: La pluma es ligera. El mensaje no.","翼の守り手：羽根は軽い。でも伝言は重い。"],"Guardiã Alada: Ciel me escreveu, grata.":["Winged Guardian: Ciel wrote to thank me, I hear.","Guardiana Alada: Ciel me escribió para darme las gracias.","翼の守り手：シエルから感謝の手紙が届いたわ。"],"Ciel: Ainda não recebi nada.":["Ciel: I haven't received anything yet.","Ciel: Todavía no he recibido nada.","シエル：まだ何も受け取っていません。"],"Ciel: A pena de minha irmã! Obrigada, herói.":["Ciel: My sister's feather! Thank you, hero.","Ciel: ¡La pluma de mi hermana! Gracias, héroe.","シエル：姉の羽根だわ！ありがとう、勇者さん。"],"Leve a pena à ilha sul-leste.":["Take the feather to the southeastern island.","Lleva la pluma a la isla del sureste.","羽根を南東の島へ届けよう。"],"As lanternas perdidas":["The Lost Lanterns","Las linternas perdidas","失われたランタン"],"Quatro lanternas antigas foram roubadas por monstros do bosque. Derrote 4 inimigos depois de aceitar.":["Four ancient lanterns were stolen by monsters from the woods. Defeat 4 enemies after accepting the quest.","Los monstruos del bosque robaron cuatro linternas antiguas. Derrota a 4 enemigos después de aceptar la misión.","森のモンスターに古いランタンを4つ盗まれた。依頼を受けたら敵を4体倒そう。"],"As lanternas voltaram a brilhar. Receba 50 rupees.":["The lanterns are shining again. Take 50 rupees.","Las linternas vuelven a brillar. Recibe 50 rupias.","ランタンに再び明かりが灯った。50ルピーを受け取ってくれ。"],"O mapa do barqueiro":["The Boatman's Map","El mapa del barquero","船頭の地図"],"Recupere o mapa escondido no baú desta vila.":["Recover the map hidden in this village's chest.","Recupera el mapa escondido en el cofre de esta aldea.","この村の宝箱に隠された地図を取り戻そう。"],"O mapa está salvo! Aqui estão 55 rupees.":["The map is safe! Here are 55 rupees.","¡El mapa está a salvo! Aquí tienes 55 rupias.","地図は無事だ！55ルピーを受け取ってくれ。"],"O remédio da curandeira":["The Healer's Medicine","La medicina de la curandera","治療師の薬"],"Encontre a erva rara no baú do pântano.":["Find the rare herb in the swamp chest.","Encuentra la hierba rara en el cofre del pantano.","沼地の宝箱にある珍しい薬草を見つけよう。"],"A erva está perfeita. A curandeira poderá salvar muitas vidas. +60 rupees.":["The herb is perfect. The healer will be able to save many lives. +60 rupees.","La hierba está perfecta. La curandera podrá salvar muchas vidas. +60 rupias.","薬草は申し分ない。これで治療師は多くの命を救える。60ルピー獲得。"],"As páginas afundadas":["The Sunken Pages","Las páginas hundidas","沈んだページ"],"Recupere as páginas da biblioteca no baú submerso.":["Recover the library pages from the submerged chest.","Recupera las páginas de la biblioteca del cofre sumergido.","水没した宝箱から図書館のページを取り戻そう。"],"As páginas foram recuperadas. +70 rupees.":["The pages have been recovered. +70 rupees.","Se han recuperado las páginas. +70 rupias.","ページを取り戻した。70ルピー獲得。"],"O descanso dos reis":["The Kings' Rest","El descanso de los reyes","王たちの安息"],"Derrote 4 guardiões da cripta após aceitar a missão.":["Defeat 4 crypt guardians after accepting the quest.","Derrota a 4 guardianes de la cripta después de aceptar la misión.","依頼を受けた後、地下墓所の守護者を4体倒そう。"],"Os reis podem descansar. +85 rupees e um coração extra.":["The kings may rest. +85 rupees and an extra heart.","Los reyes ya pueden descansar. +85 rupias y un corazón extra.","王たちは安らかに眠れる。85ルピーとハート1つ獲得。"],"O minério vermelho":["The Red Ore","El mineral rojo","赤い鉱石"],"Traga o minério raro do baú do desfiladeiro.":["Bring the rare ore from the canyon chest.","Trae el mineral raro del cofre del desfiladero.","峡谷の宝箱から珍しい鉱石を持ってこよう。"],"O minério é autêntico! +65 rupees.":["The ore is genuine! +65 rupees.","¡El mineral es auténtico! +65 rupias.","本物の鉱石だ！65ルピー獲得。"],"Sinais entre as estrelas":["Signs Among the Stars","Señales entre las estrellas","星々のしるし"],"Encontre o fragmento celeste no observatório.":["Find the celestial fragment in the observatory.","Encuentra el fragmento celeste en el observatorio.","天文台で天上の欠片を見つけよう。"],"O fragmento revela uma nova constelação. +90 rupees.":["The fragment reveals a new constellation. +90 rupees.","El fragmento revela una nueva constelación. +90 rupias.","欠片が新たな星座を映し出した。90ルピー獲得。"],"O coração da mina":["The Heart of the Mine","El corazón de la mina","鉱山の心臓"],"Derrote 5 monstros da mina para proteger os trabalhadores.":["Defeat 5 mine monsters to protect the workers.","Derrota a 5 monstruos de la mina para proteger a los trabajadores.","鉱山の作業員を守るため、鉱山のモンスターを5体倒そう。"],"A mina está segura! +100 rupees e +1 coração.":["The mine is safe! +100 rupees and +1 heart.","¡La mina está a salvo! +100 rupias y +1 corazón.","鉱山は安全になった！100ルピーとハート+1！"],"Item recuperado.":["Item recovered.","Objeto recuperado.","アイテムを取り戻した。"],"Procure o baú marcado nesta região.":["Look for the marked chest in this region.","Busca el cofre marcado en esta región.","この地域で印のついた宝箱を探そう。"],"Progresso nesta sala:":["Progress in this room:","Progreso en esta sala:","この部屋での進行状況："],"Progresso nesta sala: 0/0 inimigos.":["Progress in this room: 0/0 enemies.","Progreso en esta sala: 0/0 enemigos.","この部屋の進行状況：敵0/0体。"],"O templo mais perigoso. Só heróis completos devem entrar. O boss é extremamente forte.":["The most dangerous temple. Only fully prepared heroes should enter. The boss is extremely strong.","El templo más peligroso. Solo deben entrar héroes preparados por completo. El jefe es extremadamente fuerte.","最も危険な神殿だ。十分に力をつけた勇者だけが入るべきだ。ボスは非常に強い。"],"Templo das Sombras. A escuridão esconde o verdadeiro perigo.":["Shadow Temple. Darkness hides the true danger.","Templo de las Sombras. La oscuridad oculta el verdadero peligro.","影の神殿。闇が本当の危険を隠している。"],"Templo do Espírito. Aqui o tempo e a memória se misturam.":["Spirit Temple. Here, time and memory intertwine.","Templo del Espíritu. Aquí el tiempo y la memoria se mezclan.","精霊の神殿。ここでは時と記憶が交わる。"],"Templo do Gelo. O frio paralisa... e o boss não espera.":["Ice Temple. The cold can paralyze you... and the boss won't wait.","Templo de Hielo. El frío paraliza... y el jefe no espera.","氷の神殿。寒さで体が凍る……ボスは待ってくれない。"],"Templo do Vento. Correntes fortes e um guardião alado.":["Wind Temple. Powerful currents and a winged guardian.","Templo del Viento. Corrientes fuertes y un guardián alado.","風の神殿。強い気流と翼を持つ守護者が待つ。"],"Uma torre esquecida. O vento sopra forte no topo.":["A forgotten tower. The wind blows fiercely at the summit.","Una torre olvidada. El viento sopla con fuerza en la cima.","忘れられた塔。頂上では風が強く吹きつける。"],"Perdi uma relíquia antiga nas Terras Sombrias, no extremo sul... traga-a!":["I lost an ancient relic in the Shadow Lands, far to the south... bring it back!","Perdí una reliquia antigua en las Tierras Sombrías, al extremo sur... ¡tráemela!","はるか南の影の地で古代の遺物をなくしてしまった……持ち帰ってくれ！"],"Já cuidei disso, obrigado!":["I've already taken care of that, thank you!","Ya me ocupé de eso, ¡gracias!","もう片付けたよ、ありがとう！"],"Qualquer pista ajuda. Boa sorte!":["Any clue helps. Good luck!","Cualquier pista ayuda. ¡Buena suerte!","どんな手がかりでも助かる。幸運を！"],"Primeiro Sangue":["First Blood","Primera sangre","初陣"],"Caçador (50 abates)":["Hunter (50 kills)","Cazador (50 derrotas)","狩人（50体撃破）"],"Explorador (60 mapas)":["Explorer (60 maps)","Explorador (60 mapas)","探検家（60マップ）"],"Ajudante (5 missões)":["Helper (5 quests)","Ayudante (5 misiones)","お助け役（クエスト5件）"],"Mestre das Missões (15)":["Quest Master (15)","Maestro de misiones (15)","クエストマスター（15件）"],"Forjador de Espadas":["Swordsmith","Forjador de espadas","剣鍛冶"],"Coração Cheio":["Full Heart","Corazón lleno","ハート満タン"],"Rico (500 rupees)":["Rich (500 rupees)","Rico (500 rupias)","大金持ち（500ルピー）"],"Viajante do Mar":["Seafarer","Viajero del mar","海の旅人"],"Herói do Céu":["Hero of the Sky","Héroe del cielo","空の勇者"],"Senhor do Tempo":["Lord of Time","Señor del tiempo","時の支配者"],"Caçador":["Hunter","Cazador","狩人"],"Exterminador":["Exterminator","Exterminador","殲滅者"],"Cartógrafo":["Cartographer","Cartógrafo","地図職人"],"Ajudante":["Helper","Ayudante","お手伝い"],"Mestre das Missões":["Quest Master","Maestro de misiones","クエストの達人"],"Caçador de Tesouros":["Treasure Hunter","Cazatesoros","トレジャーハンター"],"Forjador":["Swordsmith","Herrero","鍛冶師"],"Rico":["Rich","Rico","大富豪"],"Lenda de Hyrule":["Legend of Hyrule","Leyenda de Hyrule","ハイラルの伝説"],"A Canção de Saria: Fá Lá Si (2x) ou a completa.":["Saria's Song: F A B (twice), or the full version.","La Canción de Saria: Fa La Si (dos veces), o la versión completa.","サリアの歌：ファ・ラ・シを2回、または完全版を演奏しよう。"],"A Ocarina responde a quem tem coragem.":["The Ocarina answers those who have courage.","La Ocarina responde a quienes tienen valor.","オカリナは勇気ある者に応える。"],"A ocarina está numa caverna ao leste. Cuidado com os monstros.":["The ocarina is in a cave to the east. Watch out for monsters.","La ocarina está en una cueva al este. Cuidado con los monstruos.","オカリナは東の洞窟にある。モンスターに気をつけて。"],"A ponte caiu! Só quem tem coragem (e a espada) passa.":["The bridge has collapsed! Only the brave (and those with a sword) can cross.","¡El puente se ha derrumbado! Solo pasan los valientes (y quienes tengan espada).","橋が崩れてしまった！勇気ある者（そして剣を持つ者）だけが渡れる。"],"Ao leste fica o Templo do Tempo.":["The Temple of Time lies to the east.","El Templo del Tiempo está al este.","東には時の神殿がある。"],"Aperte B para tocar a Ocarina. Teclas 1-8.":["Press B to play the Ocarina. Use keys 1–8.","Pulsa B para tocar la Ocarina. Usa las teclas 1–8.","Bでオカリナを演奏。キー1〜8を使おう。"],"Aqui as deusas ouvem as canções. Toque a Canção do Destino quando estiver pronto.":["The goddesses hear the songs here. Play the Song of Destiny when you are ready.","Aquí las diosas escuchan las canciones. Toca la Canción del Destino cuando estés listo.","ここでは女神たちが歌を聞いている。準備ができたら運命の歌を奏でよう。"],"Aqui eu só vejo um pirralho de chapéu verde!":["All I see is a little brat in a green hat!","¡Aquí solo veo a un mocoso con sombrero verde!","ここにいるのは緑の帽子をかぶったガキだけじゃないか！"],"As ruínas antigas... algo dorme nas profundezas...":["The ancient ruins... something sleeps in their depths...","Las ruinas antiguas... algo duerme en sus profundidades...","古代の遺跡……その奥底で何かが眠っている……"],"As águas lembram a voz da Princesa.":["The waters remember the Princess's voice.","Las aguas recuerdan la voz de la Princesa.","水は姫の声を覚えている。"],"As águas sagradas restauram a alma.":["The sacred waters restore the soul.","Las aguas sagradas restauran el alma.","聖なる水は魂を癒やす。"],"Brrr! Dizem que o céu chora logo ao norte.":["Brrr! They say the heavens are weeping just to the north.","¡Brrr! Dicen que el cielo llora un poco más al norte.","ぶるる！北のすぐ向こうでは空が泣いているそうだ。"],"Cristais brilham quando a Canção da Luz é tocada.":["Crystals shine when the Song of Light is played.","Los cristales brillan cuando se toca la Canción de la Luz.","光の歌を奏でると水晶が輝く。"],"Cuidado: o chefe final se cura e mira à frente de você. O escudo ajuda.":["Careful: the final boss heals and aims ahead of your position. Your shield will help.","Cuidado: el jefe final se cura y apunta por delante de ti. El escudo te ayudará.","注意：ラスボスは回復し、こちらの少し先を狙ってくる。盾が役に立つ。"],"Dizem que o herói do céu dormiu 100 anos... será você?":["They say the hero of the sky slept for 100 years... could that be you?","Dicen que el héroe del cielo durmió 100 años... ¿serás tú?","空の勇者は100年眠ったという……きみのことかい？"],"Do alto se vê o Castelo... e a sombra de Ganomisgan.":["From up here, you can see the Castle... and Ganomisgan's shadow.","Desde aquí se ve el Castillo... y la sombra de Ganomisgan.","ここからは城が見える……そしてガノミスガンの影も。"],"Esta caverna é enorme e escura...":["This cave is huge and dark...","Esta cueva es enorme y oscura...","この洞窟は広く、暗い……"],"Este templo guarda as lágrimas da deusa.":["This temple holds the tears of the goddess.","Este templo guarda las lágrimas de la diosa.","この神殿には女神の涙が眠っている。"],"Este templo guarda o conhecimento das canções antigas.":["This temple safeguards the knowledge of the ancient songs.","Este templo guarda el conocimiento de las canciones antiguas.","この神殿は古代の歌の知識を守っている。"],"Este vale leva ao Campo. Mas há um atalho secreto ao norte se você tiver a canção certa...":["This valley leads to the Field. But there is a secret shortcut to the north if you know the right song...","Este valle lleva al Campo. Pero hay un atajo secreto al norte si conoces la canción adecuada...","この谷は平原へ続いている。だが、正しい歌を知っていれば北に秘密の近道がある……"],"Kologs escondem tesouros. Mate 5 monstros no total e volte para uma recompensa especial.":["Kologs hide treasures. Defeat 5 monsters in total and return for a special reward.","Los Kolog esconden tesoros. Derrota a 5 monstruos en total y vuelve para recibir una recompensa especial.","コログは宝を隠している。モンスターを合計5体倒して戻れば、特別な報酬がもらえる。"],"Leve este coração. Ganomisgan não espera misericórdia.":["Take this heart. Ganomisgan shows no mercy.","Llévate este corazón. Ganomisgan no tendrá piedad.","このハートを持っていけ。ガノミスガンは容赦しない。"],"Lá você aprenderá a Canção do Destino.":["There, you will learn the Song of Destiny.","Allí aprenderás la Canción del Destino.","そこで運命の歌を学ぶことになる。"],"Mais fundo na caverna... Dizem que há um baú enterrado em algum lugar por aqui.":["Deeper in the cave... They say a buried chest lies somewhere around here.","Más adentro de la cueva... Dicen que hay un cofre enterrado por aquí.","洞窟のさらに奥へ……この辺りのどこかに埋もれた宝箱があるらしい。"],"Muitos se perdem aqui... a Canção de Saria ajuda a encontrar o caminho.":["Many get lost here... Saria's Song helps you find the way.","Muchos se pierden aquí... la Canción de Saria ayuda a encontrar el camino.","ここでは迷う者が多い……サリアの歌が道を見つける助けになる。"],"Nestas colinas há pedras que escondem baús.":["These hills hold stones that conceal chests.","En estas colinas hay piedras que esconden cofres.","この丘には宝箱を隠した岩がある。"],"Norte: Castelo. Sul: Kakariko. Leste: Lago Hylia.":["North: Castle. South: Kakariko. East: Lake Hylia.","Norte: Castillo. Sur: Kakariko. Este: Lago Hylia.","北：城。南：カカリコ。東：ハイリア湖。"],"Norte: Domínio Zora. Sul: Rancho Lon Lon.":["North: Zora's Domain. South: Lon Lon Ranch.","Norte: Dominio Zora. Sur: Rancho Lon Lon.","北：ゾーラの里。南：ロンロン牧場。"],"O Sábio aguarda mais adiante. Prepare o coração.":["The Sage awaits farther ahead. Prepare your heart.","El Sabio te espera más adelante. Prepara el corazón.","賢者がこの先で待っている。心の準備をしよう。"],"O botão Livre deixa você ensaiar sem ativar magia.":["The Free button lets you practice without activating magic.","El botón Libre te permite practicar sin activar magia.","フリーボタンを使えば、魔法を発動せずに練習できる。"],"O frio corta a pele. A Canção da Proteção ajuda.":["The cold cuts to the bone. The Song of Protection helps.","El frío corta la piel. La Canción de Protección ayuda.","寒さが肌を切り裂く。守りの歌が助けになる。"],"O grande Campo de Hyrule se estende em todas as direções. Explore livremente.":["The vast Hyrule Field stretches in every direction. Explore freely.","El vasto Campo de Hyrule se extiende en todas direcciones. Explora libremente.","広大なハイラル平原はあらゆる方向に広がっている。自由に探索しよう。"],"O vento sussurra: a última prova está logo acima.":["The wind whispers: the final trial lies just above.","El viento susurra: la última prueba está justo arriba.","風がささやく。最後の試練はすぐ上にある。"],"Os Kologs guardam segredos da floresta. Explore todos os caminhos.":["The Kologs keep the forest's secrets. Explore every path.","Los Kolog guardan los secretos del bosque. Explora todos los caminos.","コログは森の秘密を守っている。すべての道を探索しよう。"],"Os monstros tomaram o Campo! O Selo Real caiu num baú no sudeste.":["Monsters have overrun the Field! The Royal Seal is in a chest to the southeast.","¡Los monstruos han tomado el Campo! El Sello Real está en un cofre al sudeste.","モンスターが平原を占領した！王家の印は南東の宝箱にある。"],"Os ventos daqui carregam segredos antigos.":["The winds here carry ancient secrets.","Los vientos de aquí llevan secretos antiguos.","ここの風は古代の秘密を運んでいる。"],"Pesco neste lago desde a Era do Céu.":["I've been fishing in this lake since the Sky Era.","Pesco en este lago desde la Era del Cielo.","空の時代からこの湖で釣りをしている。"],"Ruínas de uma era passada. Dizem que um herói deixou algo escondido.":["Ruins from a bygone age. They say a hero left something hidden here.","Ruinas de una era pasada. Dicen que un héroe dejó algo escondido.","過ぎ去った時代の遺跡。ある勇者が何かを隠したという。"],"Sem ela, os monstros do Campo vão te devorar.":["Without it, the monsters in the Field will devour you.","Sin ella, los monstruos del Campo te devorarán.","それがなければ、平原のモンスターに食べられてしまう。"],"Side quest: mate todos os monstros daqui e eu te dou um frasco.":["Side quest: defeat every monster here and I'll give you a bottle.","Misión secundaria: derrota a todos los monstruos de aquí y te daré un frasco.","サブクエスト：ここのモンスターをすべて倒せば、ビンをあげよう。"],"Sombra e silêncio... a Canção da Sombra paralisa os que espreitam.":["Shadow and silence... the Song of Shadow freezes those who lurk.","Sombra y silencio... la Canción de la Sombra paraliza a quienes acechan.","影と静寂……影の歌は潜む者たちを凍りつかせる。"],"Sou Malon! Muito prazer em conhecê-lo!":["I'm Malon! It's a pleasure to meet you!","¡Soy Malon! ¡Es un placer conocerte!","マロンよ！会えてうれしいわ！"],"Sou um Goron! Aqui esquenta, mas o Sábio do Destino está perto.":["I'm a Goron! It gets hot here, but the Sage of Destiny is close by.","¡Soy un Goron! Aquí hace calor, pero el Sabio del Destino está cerca.","おれはゴロンだ！ここは暑いが、運命の賢者はすぐ近くだ。"],"Sou um Kolog! A Espada dorme num baú no canto leste da clareira.":["I'm a Kolog! The Sword rests in a chest at the eastern edge of the clearing.","¡Soy un Kolog! La Espada descansa en un cofre en el extremo este del claro.","ぼくはコログ！剣は広場の東端にある宝箱で眠っているよ。"],"Tem uma canção que minha mãe cantava à mim... se estiver interessado, a canção é: Dó Lá Sol (2x).":["There's a song my mother used to sing to me... if you're interested, it's: C A G (twice).","Hay una canción que mi madre me cantaba... si te interesa, es: Do La Sol (dos veces).","母が私によく歌ってくれた歌があるの……よかったら、ド・ラ・ソを2回奏でてみて。"],"Templo da Chama. O guardião do fogo aguarda no altar.":["Temple of Flame. The fire guardian awaits at the altar.","Templo de la Llama. El guardián del fuego espera en el altar.","炎の神殿。炎の守護者が祭壇で待っている。"],"Templo da Floresta. As raízes antigas protegem o boss.":["Forest Temple. Ancient roots protect the boss.","Templo del Bosque. Las raíces antiguas protegen al jefe.","森の神殿。古代の根がボスを守っている。"],"Templo das profundezas. Cuidado com as correntes e o guardião.":["Temple of the Depths. Beware of the currents and the guardian.","Templo de las Profundidades. Cuidado con las corrientes y el guardián.","深淵の神殿。水流と守護者に気をつけろ。"],"Toque a Canção da Vida perto da água.":["Play the Song of Life near the water.","Toca la Canción de la Vida cerca del agua.","水辺で生命の歌を奏でよう。"],"Toque a Canção do Vento para viajar mais rápido.":["Play the Song of Wind to travel faster.","Toca la Canción del Viento para viajar más rápido.","風の歌を奏でると、より速く移動できる。"],"Um galho útil está num baú por aqui. A Ocarina fica mais adiante, na clareira.":["A useful stick is in a chest nearby. The Ocarina lies farther ahead, in the clearing.","Hay una rama útil en un cofre cercano. La Ocarina está más adelante, en el claro.","近くの宝箱に役立つ枝がある。オカリナはさらに先の空き地にある。"],"Um oásis no deserto. Descanse aqui.":["An oasis in the desert. Rest here.","Un oasis en el desierto. Descansa aquí.","砂漠のオアシス。ここで休もう。"],"Use a Canção da Cura (Dó Mi Sol Mi Dó) se estiver ferido.":["If you're hurt, play the Song of Healing (C E G E C).","Si estás herido, toca la Canción de la Curación (Do Mi Sol Mi Do).","傷ついたら癒しの歌（ド・ミ・ソ・ミ・ド）を奏でよう。"],"Use a Canção da Revelação.":["Use the Song of Revelation.","Usa la Canción de la Revelación.","啓示の歌を使おう。"],"Uuuuh... eu era um herói como você.":["Uuuuh... I was a hero just like you.","Uuuuh... yo era un héroe como tú.","ううう……わしもきみのような勇者だった。"],"Viajante... o deserto engole os distraídos.":["Traveler... the desert swallows the unwary.","Viajero... el desierto devora a los distraídos.","旅人よ……砂漠は油断した者を飲み込む。"],"Você encontrou o caminho secreto! Continue para o norte.":["You found the secret path! Keep heading north.","¡Has encontrado el camino secreto! Continúa hacia el norte.","秘密の道を見つけた！北へ進もう。"],"Clareira dos Espíritos":["Spirit Clearing","Claro de los Espíritus","精霊の空き地"],"Clareira dos Kologs":["Kolog Clearing","Claro de los Kolog","コログの空き地"],"Salão de Ganomisgan":["Ganomisgan's Hall","Salón de Ganomisgan","ガノミスガンの広間"],"Santuário do Destino":["Sanctuary of Destiny","Santuario del Destino","運命の聖域"],"Templo Espírito - Santuário":["Spirit Temple – Sanctuary","Templo del Espíritu – Santuario","魂の神殿・聖域"],"Templo Final - Coração":["Final Temple – Heart","Templo Final – Corazón","最終神殿・心臓部"],"Templo Final - Entrada":["Final Temple – Entrance","Templo Final – Entrada","最終神殿・入口"],"Templo Floresta - Coração":["Forest Temple – Heart","Templo del Bosque – Corazón","森の神殿・心臓部"],"Templo Sombras - Abismo":["Shadow Temple – Abyss","Templo de las Sombras – Abismo","闇の神殿・深淵"],"Templo Vento - Topo":["Wind Temple – Summit","Templo del Viento – Cima","風の神殿・頂上"],"Templo da Chama - Altar":["Temple of Flame – Altar","Templo de la Llama – Altar","炎の神殿・祭壇"],"Templo da Floresta Ancestral":["Ancient Forest Temple","Templo del Bosque Ancestral","古代の森の神殿"],"Templo da Água - Núcleo":["Water Temple – Core","Templo del Agua – Núcleo","水の神殿・中枢"],"Templo da Água Profunda":["Deep Water Temple","Templo del Agua Profunda","深水の神殿"],"Narrador: Ao norte do Bosque Faron, a luz some entre copas imensas. É a Floresta Kokiri.":["Narrator: North of Faron Woods, the light fades beneath immense treetops. This is Kokiri Forest.","Narrador: Al norte del Bosque Faron, la luz desaparece bajo enormes copas. Este es el Bosque Kokiri.","語り部：ファロンの森の北、巨大な木々の梢の下で光が消えていく。ここはコキリの森。"],"Uma voz de criança ecoa: 'Ele voltou... o herói que dormiu cem anos!'":["A child's voice echoes: 'He's back... the hero who slept for a hundred years!'","Resuena la voz de un niño: «Ha vuelto... ¡el héroe que durmió cien años!»","子どもの声が響く：「帰ってきた……百年眠っていた勇者が！」"],"Link sente a espada tremer. Algo antigo chama dentro da mata.":["Link feels his sword tremble. Something ancient is calling from within the forest.","Link siente temblar su espada. Algo antiguo lo llama desde el interior del bosque.","リンクは剣が震えるのを感じる。森の奥から、古き何かが呼んでいる。"],"Mido: Ei, forasteiro! A Floresta é proibida a quem veste verde e fala pouco!":["Mido: Hey, stranger! The Forest is off-limits to anyone who wears green and barely speaks!","Mido: ¡Eh, forastero! ¡El Bosque está prohibido para quien viste de verde y habla poco!","ミド：おい、よそ者！緑の服を着て口数の少ない奴は森に入っちゃいけないんだ！"],"Saria: Mido, pare! Esse é o Link. A Princesa Zelda me falou dele em sonho.":["Saria: Mido, stop! This is Link. Princess Zelda told me about him in a dream.","Saria: ¡Mido, basta! Él es Link. La Princesa Zelda me habló de él en un sueño.","サリア：ミド、やめて！彼はリンクよ。ゼルダ姫が夢の中で教えてくれたの。"],"Mido: ...Tá bom. Mas se quebrar algo, a culpa é sua.":["Mido: ...Fine. But if you break anything, it's your fault.","Mido: ...Está bien. Pero si rompes algo, será culpa tuya.","ミド：……わかったよ。でも何か壊したら、お前のせいだからな。"],"Saria: Link, a Grande Árvore Deku está doente. Algo vive dentro dela.":["Saria: Link, the Great Deku Tree is ill. Something is living inside it.","Saria: Link, el Gran Árbol Deku está enfermo. Algo vive en su interior.","サリア：リンク、デクの大樹が病気なの。中に何かが棲みついているわ。"],"Saria: Entre na Árvore ao norte. Destrua o mal no núcleo — e ouça o que ela ainda puder dizer.":["Saria: Enter the Tree to the north. Destroy the evil at its core—and hear whatever it still has to tell you.","Saria: Entra en el Árbol del norte. Destruye el mal en su núcleo y escucha lo que aún pueda decirte.","サリア：北にある大樹の中へ入って。中心に巣食う邪悪を倒し、樹がまだ伝えられることを聞いて。"],"Saria: Sem a Esmeralda Kokiri, o Selo Real nunca será seu. Vá, herói!":["Saria: Without the Kokiri Emerald, the Royal Seal will never be yours. Go, hero!","Saria: Sin la Esmeralda Kokiri, el Sello Real nunca será tuyo. ¡Ve, héroe!","サリア：コキリのエメラルドがなければ、王家の印は手に入らないわ。行って、勇者よ！"],"Uma voz antiga ecoa da casca: Link... eu sentia que vinha.":["An ancient voice echoes from the bark: Link... I sensed you were coming.","Una voz antigua resuena desde la corteza: Link... sentía que vendrías.","樹皮の中から古い声が響く：リンク……お前が来るのを感じていた。"],"Grande Árvore Deku: Uma praga foi plantada em meu coração. Entre em mim... e destrua o parasita.":["Great Deku Tree: A blight has taken root in my heart. Enter me... and destroy the parasite.","Gran Árbol Deku: Una plaga ha echado raíces en mi corazón. Entra en mí... y destruye al parásito.","デクの大樹：私の心に病魔が植えつけられた。中へ入るのだ……そして寄生体を倒してくれ。"],"Voz de Zelda: Link... consegue me ouvir? Estou presa no Castelo, mas meu espírito caminha por Hyrule.":["Voice of Zelda: Link... can you hear me? I am trapped in the Castle, but my spirit still walks across Hyrule.","Voz de Zelda: Link... ¿puedes oírme? Estoy atrapada en el Castillo, pero mi espíritu recorre Hyrule.","ゼルダの声：リンク……聞こえる？私は城に囚われているけれど、魂はまだハイラルを歩いているわ。"],"Voz de Zelda: Reúna os 4 Fragmentos do Destino e a Esmeralda Kokiri. Só assim o Selo Real abrirá o portão.":["Voice of Zelda: Gather the 4 Destiny Fragments and the Kokiri Emerald. Only then will the Royal Seal open the gate.","Voz de Zelda: Reúne los 4 Fragmentos del Destino y la Esmeralda Kokiri. Solo entonces el Sello Real abrirá la puerta.","ゼルダの声：運命のかけらを4つとコキリのエメラルドを集めて。そうすれば王家の印が門を開くわ。"],"Voz de Zelda: Quando chegar a mim, entregue a Ocarina. Ela precisa estar em segurança.":["Voice of Zelda: When you reach me, give me the Ocarina. It must be kept safe.","Voz de Zelda: Cuando llegues a mí, entrégame la Ocarina. Debe estar a salvo.","ゼルダの声：私のもとへ来たら、オカリナを渡して。安全に守らなければ。"],"Patriarca Goron: Hmm! Um humano nas Montanhas! Faz cem anos que ninguém sobe aqui.":["Goron Patriarch: Hmm! A human in the Mountains! No one has climbed up here in a hundred years.","Patriarca Goron: ¡Hmm! ¡Un humano en las Montañas! Hace cien años que nadie sube hasta aquí.","ゴロンの族長：むむ！山に人間だと！ここに登ってくる者は百年もいなかったぞ。"],"Patriarca Goron: O vulcão ruge desde que o herói adormeceu. Dizem que um dragão acordou lá embaixo.":["Goron Patriarch: The volcano has roared ever since the hero fell asleep. They say a dragon has awakened below.","Patriarca Goron: El volcán ruge desde que el héroe se durmió. Dicen que un dragón ha despertado ahí abajo.","ゴロンの族長：勇者が眠りについてから火山が唸り続けている。地下で竜が目覚めたという話だ。"],"Patriarca Goron: Se acalmar o Covil Vulcânico, os Gorons te chamarão de irmão.":["Goron Patriarch: If you calm the Volcanic Lair, the Gorons will call you brother.","Patriarca Goron: Si calmas la Guarida Volcánica, los Goron te llamarán hermano.","ゴロンの族長：火山の巣を鎮めれば、ゴロンたちはお前を兄弟と呼ぶだろう。"],"Princesa Ruto: Sou Ruto, filha do Rei Zora. As águas já cantaram para a Princesa Zelda...":["Princess Ruto: I am Ruto, daughter of the Zora King. These waters once sang for Princess Zelda...","Princesa Ruto: Soy Ruto, hija del Rey Zora. Estas aguas cantaron una vez para la Princesa Zelda...","ルト姫：私はルト、ゾーラ王の娘です。この水はかつてゼルダ姫のために歌っていました……"],"Princesa Ruto: Hoje elas gemem. A sombra suja o rio até o mar.":["Princess Ruto: Today they groan. The shadow has tainted the river all the way to the sea.","Princesa Ruto: Hoy gimen. La sombra ha contaminado el río hasta el mar.","ルト姫：今では水がうめいています。影が川を海まで汚しているのです。"],"Nabooru: Alto, viajante! Sou Nabooru, dos Gerudo.":["Nabooru: Halt, traveler! I am Nabooru of the Gerudo.","Nabooru: ¡Alto, viajero! Soy Nabooru, de las Gerudo.","ナボール：止まりなさい、旅人！私はゲルド族のナボール。"],"Nabooru: O deserto engoliu três caravanas desde que a sombra cresceu.":["Nabooru: The desert has swallowed three caravans since the shadow grew.","Nabooru: El desierto ha devorado tres caravanas desde que la sombra se extendió.","ナボール：影が大きくなってから、砂漠は三つの隊商を飲み込んだ。"],"Nabooru: Se vir um lobo cinzento rosnando, dê um passo ao lado: ele ataca em linha reta.":["Nabooru: If you see a growling gray wolf, step aside: it attacks in a straight line.","Nabooru: Si ves un lobo gris gruñendo, apártate: ataca en línea recta.","ナボール：唸る灰色の狼を見たら横に避けて。一直線に突進してくるわ。"],"A terra treme. Um rugido seco rasga o ar.":["The ground trembles. A harsh roar tears through the air.","La tierra tiembla. Un rugido áspero rasga el aire.","大地が揺れる。乾いた咆哮が空気を切り裂く。"],"Voz de Ganomisgan: Herói adormecido... cada selo que quebrar só me aproxima da Ocarina.":["Voice of Ganomisgan: Sleeping hero... every seal you break brings me closer to the Ocarina.","Voz de Ganomisgan: Héroe dormido... cada sello que rompas me acerca más a la Ocarina.","ガノミスガンの声：眠れる勇者よ……お前が封印を一つ破るたび、オカリナに近づくのはこの私だ。"],"Link aperta o punho. O Covil do Dragão aguarda adiante.":["Link clenches his fist. The Dragon's Lair lies ahead.","Link aprieta el puño. La Guarida del Dragón lo espera más adelante.","リンクは拳を握りしめる。ドラゴンの巣がこの先で待っている。"],"Mago do Gelo: Congelei aqui para esperar o herói. A Era do Céu ainda sussurra nestas pedras.":["Ice Mage: I froze myself here to await the hero. The Sky Era still whispers through these stones.","Mago de Hielo: Me congelé aquí para esperar al héroe. La Era del Cielo aún susurra en estas piedras.","氷の魔道士：勇者を待つため、私はここで自らを凍らせた。この石には今も空の時代のささやきが残っている。"],"Mago do Gelo: A Fortaleza guarda o último eco da Canção do Destino. Ganomisgan a teme.":["Ice Mage: The Fortress holds the last echo of the Song of Destiny. Ganomisgan fears it.","Mago de Hielo: La Fortaleza guarda el último eco de la Canción del Destino. Ganomisgan la teme.","氷の魔道士：この要塞には運命の歌の最後のこだまが眠っている。ガノミスガンはそれを恐れている。"],"O céu escurece. Cada passo parece afundar no vazio.":["The sky darkens. Every step seems to sink into the void.","El cielo se oscurece. Cada paso parece hundirse en el vacío.","空が暗くなる。一歩ごとに虚無へ沈んでいくようだ。"],"Voz de Ganomisgan: Aqui meu primeiro fragmento nasceu. Aqui você vai ficar.":["Voice of Ganomisgan: Here my first fragment was born. Here you will remain.","Voz de Ganomisgan: Aquí nació mi primer fragmento. Aquí te quedarás.","ガノミスガンの声：ここで我が最初のかけらが生まれた。お前もここに留まるのだ。"],"Link encara a Torre da Sombra. Alguém precisa pará-la.":["Link faces the Shadow Tower. Someone must stop it.","Link se enfrenta a la Torre de la Sombra. Alguien debe detenerla.","リンクは影の塔を見据える。誰かが止めなければならない。"],"Voz de Zelda: Link... este é o Altar Dourado, onde a Deusa deixou a primeira Ocarina.":["Voice of Zelda: Link... this is the Golden Altar, where the Goddess left the first Ocarina.","Voz de Zelda: Link... este es el Altar Dorado, donde la Diosa dejó la primera Ocarina.","ゼルダの声：リンク……ここは黄金の祭壇。女神が最初のオカリナを残した場所よ。"],"Voz de Zelda: Quando tudo acabar, lembre-se: a canção é o verdadeiro poder.":["Voice of Zelda: When all is over, remember: the song is the true power.","Voz de Zelda: Cuando todo termine, recuerda: la canción es el verdadero poder.","ゼルダの声：すべてが終わったら思い出して。歌こそが真の力よ。"],"Voz de Zelda: Venha ao Castelo. O destino... está pronto.":["Voice of Zelda: Come to the Castle. Destiny... is ready.","Voz de Zelda: Ven al Castillo. El destino... está preparado.","ゼルダの声：城へ来て。運命は……準備ができているわ。"],"Ciel: Bem-vindo às Ilhas Celestes, herói do tempo.":["Ciel: Welcome to the Celestial Isles, Hero of Time.","Ciel: Bienvenido a las Islas Celestes, héroe del tiempo.","シエル：天空の島々へようこそ、時の勇者よ。"],"Ciel: Eu guardo o último eco da Deusa.":["Ciel: I guard the Goddess's final echo.","Ciel: Yo custodio el último eco de la Diosa.","シエル：私は女神の最後のこだまを守っています。"],"Ciel: Quer saber a verdade sobre Ganomisgan?":["Ciel: Do you want to know the truth about Ganomisgan?","Ciel: ¿Quieres conocer la verdad sobre Ganomisgan?","シエル：ガノミスガンの真実を知りたいですか？"],"Ancião das Nuvens: Um herói! Faz séculos que o céu não recebe visitas.":["Cloud Elder: A hero! The sky hasn't welcomed visitors in centuries.","Anciano de las Nubes: ¡Un héroe! Hace siglos que el cielo no recibe visitantes.","雲の長老：勇者だと！空に客人が訪れるのは何世紀ぶりだろう。"],"Guardião do Templo: Alto! Este templo só se abre a quem provou coragem.":["Temple Guardian: Halt! This temple opens only to those who have proven their courage.","Guardián del Templo: ¡Alto! Este templo solo se abre a quienes han demostrado su valor.","神殿の守護者：止まれ！この神殿は勇気を証明した者にしか開かれぬ。"],"Guardião do Templo: Prove-a... ou caia como tantos outros.":["Temple Guardian: Prove it... or fall like so many others.","Guardián del Templo: Demuéstralo... o caerás como tantos otros.","神殿の守護者：証明してみよ……さもなくば、他の者たちと同じように倒れるがよい。"],"Impa: Link! Você realmente voltou.":["Impa: Link! You truly came back.","Impa: ¡Link! De verdad has regresado.","インパ：リンク！本当に戻ってきたのですね。"],"Guarda Real: Pare! Ninguém passa sem o Selo Real.":["Royal Guard: Stop! No one may pass without the Royal Seal.","Guardia Real: ¡Alto! Nadie pasa sin el Sello Real.","王家の衛兵：止まれ！王家の印なしに通ることはできない。"],"Ganomisgan: Então o herói adormecido chega ao fim da jornada.":["Ganomisgan: So the sleeping hero has reached the end of his journey.","Ganomisgan: Así que el héroe dormido ha llegado al final de su viaje.","ガノミスガン：眠れる勇者も、ついに旅の終わりにたどり着いたか。"],"Ganomisgan: A Ocarina será minha. O tempo será meu.":["Ganomisgan: The Ocarina will be mine. Time will be mine.","Ganomisgan: La Ocarina será mía. El tiempo será mío.","ガノミスガン：オカリナは我のもの。時もまた我のものだ。"],"Ganomisgan: Última chance: entregue a Ocarina e viva.":["Ganomisgan: Last chance: give me the Ocarina and live.","Ganomisgan: Última oportunidad: entrégame la Ocarina y vivirás.","ガノミスガン：最後の機会だ。オカリナを渡せば命は助けてやる。"],"Impa: Cem anos se passaram, mas Kakariko ainda guarda sua memória.":["Impa: A hundred years have passed, but Kakariko still holds your memory.","Impa: Han pasado cien años, pero Kakariko aún conserva tu recuerdo.","インパ：百年が過ぎても、カカリコはあなたの記憶を守っています。"],"Ancião das Nuvens: No Templo Celeste dorme a Lâmina do Destino.":["Cloud Elder: The Blade of Destiny sleeps in the Celestial Temple.","Anciano de las Nubes: En el Templo Celeste duerme la Hoja del Destino.","雲の長老：天空の神殿には運命の刃が眠っている。"],"Ancião das Nuvens: Converse com o povo: eles precisam de você.":["Cloud Elder: Speak with the people. They need you.","Anciano de las Nubes: Habla con la gente: te necesitan.","雲の長老：民と話してやりなさい。皆、そなたを必要としている。"],"Soldado: Dizem que Hyrule nasceu quando um herói e uma princesa selaram o Imprisoned.":["Soldier: They say Hyrule was born when a hero and a princess sealed the Imprisoned.","Soldado: Dicen que Hyrule nació cuando un héroe y una princesa sellaron al Imprisoned.","兵士：勇者と姫が封印されたものを封じた時、ハイラルが生まれたと言われている。"],"Soldado: Centenas de anos depois, ainda guardamos o Portão contra a sombra.":["Soldier: Hundreds of years later, we still guard the Gate against the shadow.","Soldado: Cientos de años después, aún protegemos la Puerta de la sombra.","兵士：何百年たった今も、我々は影から門を守り続けている。"],"Sábio do Pântano: Os Kokiri são o último elo com a Era do Céu.":["Swamp Sage: The Kokiri are the last link to the Sky Era.","Sabio del Pantano: Los Kokiri son el último vínculo con la Era del Cielo.","沼の賢者：コキリ族は空の時代につながる最後の絆だ。"],"Sábio do Pântano: Suas árvores guardam as sementes da Deusa.":["Swamp Sage: Their trees hold the seeds of the Goddess.","Sabio del Pantano: Sus árboles guardan las semillas de la Diosa.","沼の賢者：彼らの樹々は女神の種を守っている。"],"Mineiro: Sob estas rochas dormem pedras de Lanayru, que dobram o tempo.":["Miner: Beneath these rocks lie stones of Lanayru, which can bend time.","Minero: Bajo estas rocas duermen piedras de Lanayru capaces de doblar el tiempo.","鉱夫：この岩の下には、時を曲げるラネールの石が眠っている。"],"Mineiro: Algum dia alguém usará esse poder numa Ocarina.":["Miner: Someday, someone will use this power in an Ocarina.","Minero: Algún día alguien usará este poder en una Ocarina.","鉱夫：いつか誰かがこの力をオカリナに宿すだろう。"],"Não, só quero lutar":["No, I only want to fight.","No, solo quiero luchar.","いや、戦いたいだけだ。"],"Link hesita por um instante.":["Link hesitates for a moment.","Link duda por un instante.","リンクは一瞬ためらう。"],"O templo recompensa você.":["The temple rewards you.","El templo te recompensa.","神殿から褒美が与えられる。"],"Guardião do Eco: O Eco desperta... o Cristal é seu.":["Guardian of the Echo: The Echo awakens... the Crystal is yours.","Guardián del Eco: El Eco despierta... el Cristal es tuyo.","こだまの守護者：こだまが目覚める……水晶はそなたのものだ。"],"A luz das lanternas se acende sozinha.":["The lanterns light up on their own.","Las linternas se encienden solas.","ランタンがひとりでに灯る。"],"Uma voz antiga atravessa as árvores: “O bosque lembra de todos que se perderam aqui.”":["An ancient voice passes through the trees: “The forest remembers everyone who got lost here.”","Una voz antigua atraviesa los árboles: «El bosque recuerda a todos los que se perdieron aquí».","古い声が木々の間を渡る：「森はここで迷った者を皆覚えている。」"],"Link percebe que os novos caminhos estão ligados a uma memória esquecida de Hyrule.":["Link realizes the new paths are connected to a forgotten memory of Hyrule.","Link comprende que los nuevos caminos están ligados a un recuerdo olvidado de Hyrule.","リンクは、新しい道がハイラルの忘れられた記憶とつながっていることに気づく。"],"O barqueiro observa o mapa rasgado.":["The boatman studies the torn map.","El barquero observa el mapa rasgado.","船頭は破れた地図を見つめる。"],"Barqueiro: “Sem estas rotas, ninguém atravessa o rio em segurança.”":["Boatman: “Without these routes, no one can cross the river safely.”","Barquero: «Sin estas rutas, nadie puede cruzar el río sin peligro».","船頭：「この航路がなければ、誰も安全に川を渡れない。」"],"Ao longe, uma embarcação vazia deriva contra a corrente.":["In the distance, an empty boat drifts against the current.","A lo lejos, una embarcación vacía deriva contra la corriente.","遠くで、空の小舟が流れに逆らって漂っている。"],"O pântano fica em silêncio por um instante.":["The swamp falls silent for a moment.","El pantano queda en silencio por un instante.","沼が一瞬、静寂に包まれる。"],"Uma sombra se ergue da água, mas desaparece antes que Link possa alcançá-la.":["A shadow rises from the water, but vanishes before Link can reach it.","Una sombra emerge del agua, pero desaparece antes de que Link pueda alcanzarla.","水面から影が立ち上がるが、リンクが近づく前に消えてしまう。"],"Voz desconhecida: “Nem toda lembrança pertence aos vivos.”":["Unknown voice: “Not every memory belongs to the living.”","Voz desconocida: «No todos los recuerdos pertenecen a los vivos».","謎の声：「すべての記憶が生者のものとは限らない。」"],"A ponte range sob o vento.":["The bridge creaks in the wind.","El puente cruje bajo el viento.","風に吹かれて橋がきしむ。"],"Guardião: “Toda promessa tem um preço. Até a promessa de um herói.”":["Guardian: “Every promise has a price. Even a hero's promise.”","Guardián: «Toda promesa tiene un precio. Incluso la promesa de un héroe».","守護者：「どんな約束にも代償がある。勇者の約束でさえも。」"],"Link olha para o outro lado: a estrada continua.":["Link looks to the other side: the road carries on.","Link mira al otro lado: el camino continúa.","リンクは向こう側を見る。道はまだ続いている。"],"A biblioteca submersa pulsa em azul.":["The submerged library pulses with blue light.","La biblioteca sumergida palpita con una luz azul.","水没した図書館が青い光を放っている。"],"Uma voz ecoa entre as estantes: “As palavras sobreviveram ao reino. Proteja-as.”":["A voice echoes between the shelves: “The words outlived the kingdom. Protect them.”","Una voz resuena entre los estantes: «Las palabras sobrevivieron al reino. Protégelas».","書棚の間に声が響く：「言葉は王国より長く生き延びた。それを守るのだ。」"],"As páginas parecem se mover como peixes na água.":["The pages seem to move like fish in the water.","Las páginas parecen moverse como peces en el agua.","ページが水中の魚のように動いている。"],"As portas da cripta se abrem lentamente.":["The crypt doors slowly open.","Las puertas de la cripta se abren lentamente.","地下墓所の扉がゆっくりと開く。"],"Rei antigo: “Não buscamos vingança. Apenas descanso.”":["Ancient King: “We seek no vengeance. Only rest.”","Rey antiguo: «No buscamos venganza. Solo descanso».","古の王：「我らは復讐を望まぬ。ただ安らぎを求めている。」"],"Um brilho frio percorre as lápides.":["A cold glimmer passes over the gravestones.","Un resplandor frío recorre las lápidas.","墓石の上を冷たい光が走る。"],"As estátuas viram a cabeça ao mesmo tempo.":["The statues turn their heads at the same time.","Las estatuas giran la cabeza al mismo tiempo.","像たちが一斉に首を向ける。"],"Uma delas sussurra: “A verdade muda quando alguém escolhe ouvi-la.”":["One of them whispers: “The truth changes when someone chooses to hear it.”","Una de ellas susurra: «La verdad cambia cuando alguien decide escucharla».","そのうちの一体がささやく：「真実は、それを聞こうと選ぶ者によって変わる。」"],"Link sente que está sendo observado.":["Link feels that he is being watched.","Link siente que alguien lo observa.","リンクは誰かに見られていると感じる。"],"O chão vermelho treme.":["The red ground trembles.","El suelo rojo tiembla.","赤い大地が震える。"],"Voz de Ganomisgan: “Você continua reunindo aliados. Eu continuo reunindo medo.”":["Voice of Ganomisgan: “You keep gathering allies. I keep gathering fear.”","Voz de Ganomisgan: «Tú sigues reuniendo aliados. Yo sigo reuniendo miedo».","ガノミスガンの声：「お前は仲間を集め続ける。我は恐怖を集め続ける。」"],"Uma pedra se parte e revela uma passagem.":["A stone splits open, revealing a passage.","Una piedra se parte y revela un pasadizo.","石が割れ、通路が現れる。"],"O observatório se ilumina.":["The observatory lights up.","El observatorio se ilumina.","天文台に明かりが灯る。"],"Astrônoma: “As estrelas mudaram de posição na noite em que você despertou.”":["Astronomer: “The stars changed position on the night you awoke.”","Astrónoma: «Las estrellas cambiaron de posición la noche en que despertaste».","天文学者：「あなたが目覚めた夜、星の位置が変わったのです。」"],"“Talvez o destino não esteja escrito. Talvez esteja esperando sua escolha.”":["“Perhaps destiny is not written. Perhaps it is waiting for your choice.”","«Quizá el destino no esté escrito. Quizá esté esperando tu elección».","「運命は書き記されていないのかもしれない。あなたの選択を待っているのかもしれない。」"],"Os cristais vibram com a presença da Ocarina.":["The crystals vibrate in the Ocarina's presence.","Los cristales vibran ante la presencia de la Ocarina.","オカリナの気配に水晶が震える。"],"Uma memória de Zelda aparece por um instante: “Link, nem toda porta se abre com força.”":["A memory of Zelda appears for an instant: “Link, not every door can be opened by force.”","Un recuerdo de Zelda aparece por un instante: «Link, no todas las puertas se abren por la fuerza».","ゼルダの記憶が一瞬現れる：「リンク、すべての扉が力で開くわけではないわ。」"],"A imagem desaparece como um reflexo na água.":["The image vanishes like a reflection in water.","La imagen desaparece como un reflejo en el agua.","その姿は水面の反射のように消えていく。"],"As marés recuam, revelando símbolos antigos.":["The tide recedes, revealing ancient symbols.","La marea retrocede y revela símbolos antiguos.","潮が引き、古代の紋様が姿を現す。"],"Voz Zora: “A água não esquece quem a salvou.”":["Zora Voice: “The water does not forget those who saved it.”","Voz Zora: «El agua no olvida a quien la salvó».","ゾーラの声：「水は救ってくれた者を忘れない。」"],"Uma melodia distante acompanha o movimento das ondas.":["A distant melody follows the movement of the waves.","Una melodía lejana acompaña el movimiento de las olas.","遠くの旋律が波の動きに寄り添う。"],"O som das ferramentas cessa na mina.":["The sound of tools stops in the mine.","El sonido de las herramientas cesa en la mina.","鉱山で道具の音が止む。"],"Goron: “Se o coração da montanha parar, todos nós perderemos nosso lar.”":["Goron: “If the mountain's heart stops, we will all lose our home.”","Goron: «Si el corazón de la montaña se detiene, todos perderemos nuestro hogar».","ゴロン：「山の心臓が止まれば、我らは皆、故郷を失うことになる。」"],"O calor aumenta na direção do túnel central.":["The heat grows stronger toward the central tunnel.","El calor aumenta en dirección al túnel central.","中央のトンネルへ向かうほど熱気が強くなる。"],"Flores se abrem à passagem de Link.":["Flowers bloom as Link passes.","Las flores se abren al paso de Link.","リンクが通ると花々が咲き始める。"],"Malon, ao longe: “Ainda há beleza neste mundo. Não deixe a sombra apagar tudo.”":["Malon, from afar: “There is still beauty in this world. Don't let the shadow erase it all.”","Malon, a lo lejos: «Aún queda belleza en este mundo. No dejes que la sombra lo borre todo».","遠くからマロンの声：「この世界にはまだ美しさが残っているわ。影にすべてを消させないで。」"],"O vento leva pétalas até a estrada.":["The wind carries petals onto the road.","El viento lleva pétalos hasta el camino.","風が花びらを道まで運んでいく。"],"A Fortaleza do Crepúsculo fecha suas portas atrás de Link.":["The Twilight Fortress closes its doors behind Link.","La Fortaleza del Crepúsculo cierra sus puertas tras Link.","黄昏の要塞がリンクの背後で扉を閉ざす。"],"Ganomisgan: “Você chama isso de esperança? Eu chamo de atraso.”":["Ganomisgan: “You call that hope? I call it a delay.”","Ganomisgan: «¿A eso lo llamas esperanza? Yo lo llamo una demora».","ガノミスガン：「それを希望と呼ぶのか？我には先延ばしにしか見えぬ。」"],"O guardião desperta no salão.":["The guardian awakens in the hall.","El guardián despierta en el salón.","守護者が広間で目を覚ます。"],"O último eco responde à Ocarina.":["The final echo answers the Ocarina.","El último eco responde a la Ocarina.","最後のこだまがオカリナに応える。"],"Zelda: “O destino não é uma ordem, Link. É uma escolha.”":["Zelda: “Destiny is not a command, Link. It is a choice.”","Zelda: «El destino no es una orden, Link. Es una elección».","ゼルダ：「運命は命令ではないわ、リンク。選択なのよ。」"],"Uma luz dourada aponta para a saída.":["A golden light points toward the exit.","Una luz dorada señala la salida.","黄金の光が出口を指し示す。"],"O vento no penhasco corta como lâmina.":["The wind on the cliff cuts like a blade.","El viento del acantilado corta como una hoja.","崖の風は刃のように鋭い。"],"Caçador: “As águias sumiram quando os monstros chegaram.”":["Hunter: “The eagles vanished when the monsters arrived.”","Cazador: «Las águilas desaparecieron cuando llegaron los monstruos».","狩人：「モンスターが現れた時、ワシたちは姿を消した。」"],"A torre vibra com um tom cristalino.":["The tower vibrates with a crystalline tone.","La torre vibra con un tono cristalino.","塔が水晶のような音色で震える。"],"Uma voz: “Guarde o cristal. O vento ainda responde a ele.”":["A voice: “Keep the crystal safe. The wind still answers to it.”","Una voz: «Guarda el cristal. El viento aún responde a él».","声：「水晶を守るのだ。風はまだそれに応えてくれる。」"],"O lago interior reflete um céu que não é este.":["The inland lake reflects a sky that is not this one.","El lago interior refleja un cielo que no es este.","内陸の湖には、この世界のものではない空が映っている。"],"Zora ancião: “Cinco sombras poluem a água. Limpe-as.”":["Elderly Zora: “Five shadows are polluting the water. Cleanse it.”","Zora anciano: «Cinco sombras contaminan el agua. Límpiala».","年老いたゾーラ：「五つの影が水を汚している。それらを浄化するのだ。」"],"A neve engole os passos.":["The snow swallows every footstep.","La nieve se traga las huellas.","雪が足跡を飲み込んでいく。"],"Viajante: “A relíquia está no baú. Não deixe o frio parar você.”":["Traveler: “The relic is in the chest. Don't let the cold stop you.”","Viajero: «La reliquia está en el cofre. No dejes que el frío te detenga».","旅人：「遺物は宝箱の中だ。寒さに足を止めるな。」"],"Poeira sobe da ravina.":["Dust rises from the ravine.","El polvo se levanta del barranco.","峡谷から砂ぼこりが舞い上がる。"],"Guia: “Quatro bestas bloqueiam a rota das caravanas.”":["Guide: “Four beasts are blocking the caravan route.”","Guía: «Cuatro bestias bloquean la ruta de las caravanas».","案内人：「四頭の獣が隊商の道を塞いでいる。」"],"O farol pisca uma vez, fraco.":["The lighthouse flickers weakly once.","El faro parpadea débilmente una vez.","灯台が弱々しく一度だけ点滅する。"],"Faroleiro: “O baú no topo guarda a lente. Traga a luz de volta.”":["Lighthouse Keeper: “The chest at the top holds the lens. Bring the light back.”","Farero: «El cofre de arriba guarda la lente. Devuelve la luz».","灯台守：「頂上の宝箱にレンズがある。光を取り戻してくれ。」"],"A muralha antiga sangra sombra.":["The ancient wall bleeds shadow.","La muralla antigua sangra sombra.","古い城壁から影が染み出している。"],"Voz: “Seis sentinelas. Nenhuma pode ficar de pé.”":["Voice: “Six sentinels. Not one can remain standing.”","Voz: «Seis centinelas. Ninguno puede quedar en pie».","声：「六体の番兵。一体も立たせておくな。」"],"Pétalas caem sem vento.":["Petals fall although there is no wind.","Caen pétalos sin que sople el viento.","風もないのに花びらが舞い落ちる。"],"Jardineiro: “Alguém deixou uma carta entre as raízes.”":["Gardener: “Someone left a letter among the roots.”","Jardinero: «Alguien dejó una carta entre las raíces».","庭師：「誰かが根の間に手紙を残していった。」"],"O espelho no centro da ruína está rachado.":["The mirror at the center of the ruins is cracked.","El espejo del centro de las ruinas está agrietado.","遺跡の中心にある鏡にはひびが入っている。"],"Sábio: “Traga o Espelho Antigo e veremos juntos.”":["Sage: “Bring the Ancient Mirror and we will see together.”","Sabio: «Trae el Espejo Antiguo y lo veremos juntos».","賢者：「古の鏡を持ってきなさい。一緒に確かめよう。」"],"A vila cheira a tinta e papel.":["The village smells of ink and paper.","La aldea huele a tinta y papel.","村にはインクと紙の匂いが漂う。"],"Mensageiro: “Uma carta selada sumiu nas terras novas.”":["Messenger: “A sealed letter has gone missing in the new lands.”","Mensajero: «Una carta sellada ha desaparecido en las nuevas tierras».","伝令：「新しい土地で封印された手紙が行方不明になった。」"],"As ruínas antigas... algo dorme nas profundezas.":["The ancient ruins... something sleeps in the depths.","Las ruinas antiguas... algo duerme en las profundidades.","古代の遺跡……深い所で何かが眠っている。"],"Quatro templos guardam os Fragmentos do Destino. Sem eles o Selo Real não abre.":["Four temples guard the Destiny Fragments. Without them, the Royal Seal will not open.","Cuatro templos guardan los Fragmentos del Destino. Sin ellos, el Sello Real no se abrirá.","四つの神殿に運命のかけらが眠る。それがなければ王家の印は開かない。"],"Morcegos de noite, fantasmas no frio... bichos diferentes em cada região.":["Bats at night, ghosts in the cold... different creatures inhabit each region.","Murciélagos por la noche, fantasmas en el frío... cada región tiene criaturas distintas.","夜にはコウモリ、寒い場所には幽霊……地域ごとに違う魔物がいる。"],"Santuários curam sua vida de graça. Procure o brilho dourado.":["Shrines restore your health for free. Look for the golden glow.","Los santuarios restauran tu salud gratis. Busca el resplandor dorado.","祠では無料で体力を回復できる。金色の輝きを探そう。"],"Octoroks não andam: eles cospem pedras. Aproxime-se pelo lado!":["Octoroks don't walk: they spit rocks. Approach from the side!","Los Octorok no caminan: escupen piedras. ¡Acércate por un lado!","オクタロックは歩かず、岩を吐く。横から近づこう！"],"Baús escondem corações. Explore os cantos dos mapas.":["Chests hide hearts. Explore the corners of each map.","Los cofres esconden corazones. Explora las esquinas de los mapas.","宝箱にはハートが隠されている。マップの隅々まで探索しよう。"],"Use SETAS ou WASD (ou o direcional na tela) para andar.":["Use the ARROW KEYS or WASD (or the on-screen D-pad) to move.","Usa las FLECHAS o WASD (o la cruceta de la pantalla) para moverte.","矢印キーまたはWASD（画面上の十字キー）で移動。"],"ESPAÇO / Z / X / Enter (botão A): falar, abrir baús e atacar.":["SPACE / Z / X / Enter (A button): talk, open chests, and attack.","ESPACIO / Z / X / Enter (botón A): hablar, abrir cofres y atacar.","SPACE / Z / X / Enter（Aボタン）：会話、宝箱を開ける、攻撃。"],"Espada! Aperte A para atacar na direção em que Link olha. Ataque pelo lado para evitar golpes.":["Sword! Press A to attack in the direction Link is facing. Strike from the side to avoid hits.","¡Espada! Pulsa A para atacar hacia donde mira Link. Ataca por un lado para evitar golpes.","剣！Aでリンクの向いている方向に攻撃。横から攻撃して反撃を避けよう。"],"Ocarina! B abre/fecha. Toque com as teclas 1 a 8; L ativa o Modo Livre. Descubra canções!":["Ocarina! B opens/closes it. Play with keys 1–8; L activates Free Mode. Discover songs!","¡Ocarina! B la abre y cierra. Toca con las teclas 1 a 8; L activa el Modo Libre. ¡Descubre canciones!","オカリナ！Bで開閉。1〜8キーで演奏し、Lでフリーモードを切り替えよう。曲を見つけよう！"],"Escudo! De frente para o golpe, ele bloqueia ataques. Parado ele defende melhor.":["Shield! Face an incoming attack to block it. Standing still makes your defense stronger.","¡Escudo! Mira hacia el ataque para bloquearlo. Si te quedas quieto, defenderás mejor.","盾！攻撃の方を向けば防げる。立ち止まると、より強く防御できる。"],"Estilingue! Use sementes à distância; o contador de sementes fica no HUD.":["Slingshot! Use seeds to hit enemies from afar; the seed counter appears in the HUD.","¡Tirachinas! Usa semillas para atacar a distancia; el contador aparece en el HUD.","パチンコ！タネを使って遠くの敵を攻撃。タネの数はHUDに表示される。"],"Itens na mochila: aperte I para abrir o inventário e usar poções e outros.":["Items in your bag: press I to open the inventory and use potions and other items.","Objetos en la mochila: pulsa I para abrir el inventario y usar pociones y otros objetos.","バッグのアイテム：Iでインベントリを開き、薬などを使おう。"],"Chave! Ela abre portas e baús trancados em algum ponto de Hyrule.":["Key! It opens locked doors and chests somewhere in Hyrule.","¡Llave! Abre puertas y cofres cerrados en algún lugar de Hyrule.","鍵！ハイラルのどこかにある鍵のかかった扉や宝箱を開けられる。"],"Rupees servem para lojas e viagem rápida entre vilas já visitadas.":["Rupees are used in shops and for fast travel between villages you've visited.","Las rupias sirven en las tiendas y para viajar rápido entre aldeas que ya visitaste.","ルピーは店での買い物や、訪れた村へのファストトラベルに使える。"],"Nova canção! Toque as notas de novo para usar. Veja o Livro de Canções no pause (P).":["New song! Play the notes again to use it. Check the Songbook in the pause menu (P).","¡Nueva canción! Vuelve a tocar las notas para usarla. Consulta el Libro de canciones en pausa (P).","新しい歌！もう一度音符を演奏して使おう。ポーズメニュー（P）の歌の本を確認しよう。"],"M abre o mapa de Hyrule. O minimapa no canto mostra a sala atual.":["M opens the map of Hyrule. The minimap in the corner shows your current room.","M abre el mapa de Hyrule. El minimapa de la esquina muestra la sala actual.","Mでハイラルの地図を開く。隅のミニマップに現在の部屋が表示される。"],"Vá ao leste do rio (mapa 6-4).":["Go east along the river (map 6-4).","Ve hacia el este del río (mapa 6-4).","川に沿って東へ進もう（マップ6-4）。"],"Continue caçando.":["Keep hunting.","Sigue cazando.","狩りを続けよう。"],"Pedido aceito! Derrote três monstros nesta vila e volte ao morador.":["Request accepted! Defeat three monsters in this village and return to the villager.","¡Pedido aceptado! Derrota a tres monstruos en esta aldea y vuelve con el aldeano.","依頼を引き受けた！この村でモンスターを3体倒し、住人のところへ戻ろう。"],"Você não tem rupees suficientes.":["You don't have enough rupees.","No tienes suficientes rupias.","ルピーが足りない。"],"Pegar a Espada (Bosque Faron).":["Get the Sword (Faron Woods).","Conseguir la Espada (Bosque Faron).","剣を手に入れる（ファロンの森）。"],"Visitar a Floresta Kokiri (norte do Bosque Faron).":["Visit Kokiri Forest (north of Faron Woods).","Visitar el Bosque Kokiri (al norte del Bosque Faron).","コキリの森を訪れる（ファロンの森の北）。"],"Entrar na Grande Árvore Deku e destruir o parasita (norte da Vila Kokiri).":["Enter the Great Deku Tree and destroy the parasite (north of Kokiri Village).","Entrar en el Gran Árbol Deku y destruir al parásito (al norte de la Aldea Kokiri).","デクの大樹に入り、寄生体を倒す（コキリ村の北）。"],"Pegar o Selo Real (Campo de Hyrule).":["Get the Royal Seal (Hyrule Field).","Conseguir el Sello Real (Campo de Hyrule).","王家の印を手に入れる（ハイラル平原）。"],"Cristal do Eco: barqueiro no Rio Zora, Ilha do Eco.":["Echo Crystal: boatman on the Zora River, Echo Island.","Cristal del Eco: barquero en el Río Zora, Isla del Eco.","こだまの水晶：ゾーラ川の船頭に会う（こだまの島）。"],"Derrotar Ganomisgan no Castelo.":["Defeat Ganomisgan in the Castle.","Derrotar a Ganomisgan en el Castillo.","城でガノミスガンを倒す。"],"Fragmentos do Destino: 0/4 (sul de Kakariko).":["Destiny Fragments: 0/4 (south of Kakariko).","Fragmentos del Destino: 0/4 (al sur de Kakariko).","運命のかけら：0/4（カカリコの南）。"],"Fragmentos do Destino:":["Destiny Fragments:","Fragmentos del Destino:","運命のかけら："],"Achar a Ocarina (Ruínas do Sono, leste).":["Find the Ocarina (Ruins of Sleep, east).","Encontrar la Ocarina (Ruinas del Sueño, este).","オカリナを見つける（眠りの遺跡・東）。"],"Aprender a Canção do Destino (Torre dos Ventos).":["Learn the Song of Destiny (Tower of Winds).","Aprender la Canción del Destino (Torre de los Vientos).","運命の歌を習う（風の塔）。"],"Aceitar missão":["Accept quest","Aceptar misión","クエストを受ける"],"Recusar":["Decline","Rechazar","断る"],"Hesitar":["Hesitate","Dudar","ためらう"],"Aceitar":["Accept","Aceptar","受ける"],"Sair":["Leave","Salir","やめる"],"Concluídas:":["Completed:","Completadas:","達成："]};
const V17={"Aqui, 40 rupees pela descoberta.":["Here, 40 rupees for the discovery.","Toma, 40 rupias por el descubrimiento.","発見の礼だ、40ルピーを受け取ってくれ。"],"Bom trabalho caçando! Aqui, 25 rupees pela ajuda.":["Good hunting! Here, 25 rupees for your help.","¡Buena cacería! Toma, 25 rupias por tu ayuda.","いい狩りだったな！手伝いの礼に25ルピーだ。"],"Morcegos de noite, fantasmas no frio... bichos diferentes em cada região.":["Bats at night, ghosts in the cold... different creatures in each region.","Murciélagos de noche, fantasmas en el frío... criaturas distintas en cada región.","夜はコウモリ、寒い所には幽霊…地域ごとに違う魔物がいる。"],"Octoroks não andam: eles cospem pedras. Aproxime-se pelo lado!":["Octoroks don't walk: they spit rocks. Approach from the side!","Los Octorok no caminan: escupen piedras. ¡Acércate por el lado!","オクタロックは歩かない。岩を吐くぞ。横から近づけ！"],"Um dragão antigo dorme no Covil.":["An ancient dragon sleeps in the Lair.","Un dragón antiguo duerme en la Guarida.","古の竜がねぐらで眠っている。"],"A Ocarina foi forjada em ruínas como estas.":["The Ocarina was forged in ruins like these.","La Ocarina fue forjada en ruinas como estas.","オカリナはこのような遺跡で鍛えられた。"],"Hyrule inteira cabe numa canção.":["All of Hyrule fits inside a song.","Todo Hyrule cabe en una canción.","ハイラル全土が一曲に収まる。"],"Elixir de Força: ataques mais fortes por um tempo!":["Strength Elixir: stronger attacks for a while!","Elixir de Fuerza: ¡ataques más fuertes por un tiempo!","力のエリクサー：しばらく攻撃力アップ！"],"Elixir de Defesa: proteção mágica por um tempo!":["Defense Elixir: magical protection for a while!","Elixir de Defensa: ¡protección mágica por un tiempo!","守りのエリクサー：しばらく魔法の守りを得る！"],"Se a mata te confundir, toque a Canção de Saria: Fá Lá Si, duas vezes.":["If the woods confuse you, play Saria's Song: F A B, twice.","Si el bosque te confunde, toca la Canción de Saria: Fa La Si, dos veces.","森で迷ったら、サリアの歌を吹いて。ファ・ラ・シを2回よ。"],"Só assim a floresta terá uma chance — mesmo que eu não sobreviva.":["Only then will the forest have a chance — even if I do not survive.","Solo así el bosque tendrá una oportunidad, aunque yo no sobreviva.","そうして初めて森に希望が生まれる。たとえ私が滅びようとも。"],"Cuidado nos charcos: criaturas saltam e cospem pedras.":["Careful around the pools: creatures leap out and spit rocks.","Cuidado en los charcos: criaturas saltan y escupen piedras.","水たまりに注意よ。魔物が跳び出して岩を吐くわ。"],"Se vir um lobo cinzento rosnando, dê um passo ao lado: ele ataca em linha reta.":["If you see a growling gray wolf, step aside: it charges in a straight line.","Si ves un lobo gris gruñendo, hazte a un lado: ataca en línea recta.","唸る灰色の狼を見たら横に避けろ。まっすぐ突進してくる。"],"Cuidado com arqueiros: eles recuam e disparam.":["Beware of archers: they back away and fire.","Cuidado con los arqueros: retroceden y disparan.","弓兵に注意。下がりながら矢を放つぞ。"],"Quando tudo acabar, lembre-se: a canção é o verdadeiro poder.":["When all is done, remember: the song is the true power.","Cuando todo acabe, recuerda: la canción es el verdadero poder.","すべてが終わったら思い出して。真の力は歌にあるの。"],"Achar a Ocarina (Ruínas do Sono, leste).":["Find the Ocarina (Ruins of Slumber, east).","Encontrar la Ocarina (Ruinas del Sueño, este).","オカリナを見つける（眠りの遺跡・東）。"],"Entrar na Grande Árvore Deku e destruir o parasita (norte da Vila Kokiri).":["Enter the Great Deku Tree and destroy the parasite (north of Kokiri Village).","Entrar en el Gran Árbol Deku y destruir al parásito (norte de la Aldea Kokiri).","デクの樹に入り、寄生虫を倒す（コキリ村の北）。"],"Aprender a Canção do Destino (Torre dos Ventos).":["Learn the Song of Destiny (Tower of Winds).","Aprender la Canción del Destino (Torre de los Vientos).","運命の歌を習う（風の塔）。"],"Tudo bem... vou me esconder.":["All right... I'll go hide.","Está bien... me voy a esconder.","わかった…隠れてるね。"],"...Eu também estou.":["...Me too.","...Yo también.","…わたしもよ。"],"Que a lâmina te sirva bem!":["May the blade serve you well!","¡Que la hoja te sirva bien!","この刃がお前を守りますように！"],"Dê uma olhada no Rio Zora, ao leste, e me conte.":["Take a look at the Zora River, to the east, and tell me.","Echa un vistazo al Río Zora, al este, y cuéntame.","東のゾーラの川を見てきて、教えてくれ。"],"Que as águas te guiem!":["May the waters guide you!","¡Que las aguas te guíen!","水の導きがあらんことを！"],"Sem pressa... a rede não vai a lugar algum.":["No rush... the net isn't going anywhere.","Sin prisa... la red no se va a ningún lado.","急がなくていい…網はどこにも行かないさ。"],"É um passeio curto, prometo.":["It's a short trip, I promise.","Es un paseo corto, lo prometo.","すぐ終わる道のりだよ、約束する。"],"Ah, ela está lá! Obrigado!":["Ah, it's there! Thank you!","¡Ah, ahí está! ¡Gracias!","ああ、そこにあったのか！ありがとう！"],"O rio está em paz.":["The river is at peace.","El río está en paz.","川は穏やかだ。"],"Preciso que alguém leve um recado ao capitão, no extremo leste do deserto.":["I need someone to carry a message to the captain, at the far east of the desert.","Necesito que alguien lleve un mensaje al capitán, en el extremo este del desierto.","砂漠の東の果てにいる隊長へ伝言を届けてくれる者が必要だ。"],"Diga a ele: 'a tempestade vem'.":["Tell him: 'the storm is coming'.","Dile: 'la tormenta viene'.","こう伝えてくれ：「嵐が来る」と。"],"Então encontrarei outro.":["Then I'll find someone else.","Entonces buscaré a otro.","ならば他の者を探そう。"],"Ninguém mais quer cruzar a areia hoje.":["Nobody wants to cross the sand today.","Hoy nadie quiere cruzar la arena.","今日は誰も砂漠を渡りたがらない。"],"Leve o recado ao capitão (extremo leste).":["Deliver the message to the captain (far east).","Lleva el mensaje al capitán (extremo este).","隊長に伝言を届ける（東の果て）。"],"Não esperava ninguém.":["I wasn't expecting anyone.","No esperaba a nadie.","誰も来ないと思っていた。"],"'A tempestade vem'... Entendido! Tome.":["'The storm is coming'... Understood! Here.","'La tormenta viene'... ¡Entendido! Toma.","「嵐が来る」か…了解だ！受け取れ。"],"O capitão agradeceu, soube.":["The captain was grateful, I heard.","El capitán lo agradeció, me enteré.","隊長は感謝していたと聞いたよ。"],"Escuro demais, né? Entendo.":["Too dark, huh? I understand.","Demasiado oscuro, ¿eh? Lo entiendo.","暗すぎるよな？わかるよ。"],"As cavernas só assustam por fora.":["Caves are only scary from the outside.","Las cuevas solo asustan por fuera.","洞窟は外から見るだけが怖いのさ。"],"Visite o salão a sudeste (mapa 3-8).":["Visit the hall to the southeast (map 3-8).","Visita el salón al sureste (mapa 3-8).","南東の広間を訪ねる（マップ3-8）。"],"Ainda brilha! Que alívio.":["It still shines! What a relief.","¡Aún brilla! Qué alivio.","まだ光ってる！よかった。"],"Elimine 8 e te recompenso.":["Defeat 8 and I'll reward you.","Elimina a 8 y te recompensaré.","8体倒してくれたら褒美をやろう。"],"Cuidado com o calor.":["Watch out for the heat.","Cuidado con el calor.","熱さに気をつけな。"],"Os jovens de hoje...":["Young people these days...","La juventud de hoy...","今どきの若者は…"],"Coragem também se treina.":["Courage can be trained too.","El valor también se entrena.","勇気も鍛えられるものさ。"],"O vulcão dorme mais tranquilo.":["The volcano sleeps more peacefully.","El volcán duerme más tranquilo.","火山は穏やかに眠っている。"],"Ele te entrega um Elixir de Defesa como agradecimento.":["He hands you a Defense Elixir as thanks.","Te entrega un Elixir de Defensa como agradecimiento.","お礼に守りのエリクサーを渡してくれた。"],"Ele abaixa a cabeça em silêncio.":["He lowers his head in silence.","Baja la cabeza en silencio.","彼は黙ってうつむいた。"],"Não precisa decidir agora.":["You don't have to decide now.","No hace falta decidir ahora.","今すぐ決めなくていいよ。"],"Nunca esquecerei sua bondade.":["I will never forget your kindness.","Nunca olvidaré tu bondad.","あなたの優しさは忘れません。"],"Derrote 5 e abriremos o tesouro da vila.":["Defeat 5 and we'll open the village treasure.","Derrota a 5 y abriremos el tesoro de la aldea.","5体倒せば村の宝を開けましょう。"],"O céu confia em você!":["The sky trusts you!","¡El cielo confía en ti!","空はあなたを信じています！"],"Voltarei a pedir, se precisar.":["I'll ask again if I need to.","Volveré a pedírtelo, si hace falta.","必要ならまたお願いしますね。"],"O céu é alto, mas você é capaz.":["The sky is high, but you can reach it.","El cielo es alto, pero tú puedes.","空は高いけれど、あなたならできます。"],"As ilhas respiram de novo!":["The islands breathe again!","¡Las islas respiran de nuevo!","島々がまた息をしています！"],"Voe em paz, herói.":["Fly in peace, hero.","Vuela en paz, héroe.","安らかに飛び立って、勇者よ。"],"Leve esta pena a Ciel, na Ilha do canto sul-leste.":["Take this feather to Ciel, on the island in the southeast corner.","Lleva esta pluma a Ciel, en la isla de la esquina sureste.","この羽根を南東の島にいるシエルに届けて。"],"A pena é leve. O recado, não.":["The feather is light. The message is not.","La pluma es ligera. El mensaje, no.","羽根は軽い。でも伝言は重いわ。"],"A pena de minha irmã! Obrigada, herói.":["My sister's feather! Thank you, hero.","¡La pluma de mi hermana! Gracias, héroe.","姉の羽根だわ！ありがとう、勇者さん。"],"Ciel me escreveu, grata.":["Ciel wrote to me, grateful.","Ciel me escribió, agradecida.","シエルから感謝の手紙が届いたわ。"],"Lembre-se: o medo é a arma dele.":["Remember: fear is his weapon.","Recuerda: el miedo es su arma.","忘れないで。恐怖こそが彼の武器よ。"],"Eu guardo o último eco da Deusa.":["I keep the last echo of the Goddess.","Guardo el último eco de la Diosa.","わたしは女神の最後のこだまを守っているの。"],"Então lute com sabedoria.":["Then fight wisely.","Entonces lucha con sabiduría.","ならば賢く戦いなさい。"],"No Templo Celeste dorme a Lâmina do Destino.":["The Blade of Destiny sleeps in the Celestial Temple.","En el Templo Celeste duerme la Hoja del Destino.","天空の神殿に運命の刃が眠っている。"],"Converse com o povo: eles precisam de você.":["Talk to the people: they need you.","Habla con la gente: te necesitan.","民と話してやりなさい。皆そなたを必要としている。"],"Prove-a... ou caia como tantos outros.":["Prove it... or fall like so many others.","Demuéstralo... o caerás como tantos otros.","証明せよ…さもなくば多くの者のように倒れるがよい。"],"Cem anos se passaram, mas Kakariko ainda guarda sua memória.":["A hundred years have passed, but Kakariko still keeps your memory.","Han pasado cien años, pero Kakariko aún guarda tu memoria.","百年が過ぎても、カカリコ村はあなたの記憶を守っています。"],"Aceita meu treinamento? Ele dura pouco, mas fortalece.":["Will you accept my training? It's short, but it makes you stronger.","¿Aceptas mi entrenamiento? Dura poco, pero fortalece.","わたしの修行を受けますか？短いですが力がつきます。"],"Sinta a força correr em você!":["Feel the strength flow through you!","¡Siente la fuerza correr en ti!","力がみなぎるのを感じなさい！"],"Cada um tem seu tempo, herói.":["Everyone has their own time, hero.","Cada quien tiene su tiempo, héroe.","人にはそれぞれの時があります、勇者よ。"],"A Princesa não recebe mais ninguém desde que a sombra cresceu.":["The Princess has received no one since the shadow grew.","La Princesa no recibe a nadie desde que creció la sombra.","影が濃くなってから、姫様は誰にもお会いにならない。"],"...Mas dizem que o herói voltou. Talvez seja você.":["...But they say the hero has returned. Maybe it's you.","...Pero dicen que el héroe ha vuelto. Quizá seas tú.","…だが勇者が戻ったという噂だ。お前かもしれんな。"],"A Ocarina será minha. O tempo será meu.":["The Ocarina will be mine. Time will be mine.","La Ocarina será mía. El tiempo será mío.","オカリナは我のもの。時もまた我のものだ。"],"Última chance: entregue a Ocarina e viva.":["Last chance: hand over the Ocarina and live.","Última oportunidad: entrega la Ocarina y vive.","最後の機会だ。オカリナを渡せば生かしてやる。"],"Para que ninguém nunca mais me esqueça.":["So that no one ever forgets me again.","Para que nadie vuelva a olvidarme.","二度と誰にも忘れられぬように。"],"Medo? Ótimo. Me alimenta!":["Fear? Excellent. It feeds me!","¿Miedo? Excelente. ¡Me alimenta!","恐れか？結構。我の糧となる！"],"A Lâmina do Destino reconhece seu coração.":["The Blade of Destiny recognizes your heart.","La Hoja del Destino reconoce tu corazón.","運命の刃はあなたの心を認めています。"]};
