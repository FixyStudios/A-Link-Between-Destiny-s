function ocarinaTone(freq,duration=.55,volume=.14){if(typeof cfg!='undefined'&&!cfg.sfx)return;

  const now=AC.currentTime, end=now+duration;
  const master=AC.createGain();
  master.gain.setValueAtTime(.0001,now);
  master.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),now+.025);
  master.gain.setValueAtTime(Math.max(.0002,volume)*.82,Math.max(now+.03,end-.10));
  master.gain.exponentialRampToValueAtTime(.0001,end);
  master.connect(AC.destination);

  const fundamental=AC.createOscillator();
  const body=AC.createGain();
  fundamental.type='sine';
  fundamental.frequency.setValueAtTime(freq,now);
  fundamental.connect(body); body.gain.value=1; body.connect(master);
  fundamental.start(now); fundamental.stop(end+.02);

  const harmonic=AC.createOscillator(), harmonicGain=AC.createGain();
  harmonic.type='sine'; harmonic.frequency.setValueAtTime(freq*2,now);
  harmonicGain.gain.value=.105;
  harmonic.connect(harmonicGain); harmonicGain.connect(master);
  harmonic.start(now); harmonic.stop(end+.02);

  const breathBuffer=AC.createBuffer(1,Math.max(1,Math.floor(AC.sampleRate*duration)),AC.sampleRate);
  const data=breathBuffer.getChannelData(0);
  for(let j=0;j<data.length;j++) data[j]=(Math.random()*2-1);
  const breath=AC.createBufferSource(), filter=AC.createBiquadFilter(), breathGain=AC.createGain();
  breath.buffer=breathBuffer;

  breathGain.gain.setValueAtTime(.0001,now);
  breathGain.gain.linearRampToValueAtTime(volume*.075,now+.035);
  breathGain.gain.setValueAtTime(volume*.055,Math.max(now+.04,end-.08));
  breathGain.gain.exponentialRampToValueAtTime(.0001,end);
  breath.connect(filter); filter.connect(breathGain); breathGain.connect(master);
  breath.start(now); breath.stop(end+.02);

  const vibrato=AC.createOscillator(), vibratoDepth=AC.createGain();
  vibrato.frequency.value=5.2; vibratoDepth.gain.value=1.2;

NX=function(e){
  if(e.k==='c'&&/^x9/.test(e.id)&&!S.f[e.id]){
    // deixa o handler antigo rodar via return path — interceptamos depois no old
  }
  // sidequest de entrega de carta / espelho
  if(e.k==='n'&&e.t==='QX_LETTER'){
    if(S.f.qx_letter==='done')return say('Obrigado de novo pela carta!');
    if(bagGet('letter')>0){
      S.bag.letter--;if(S.bag.letter<=0)delete S.bag.letter;
      S.f.qx_letter='done';S.ru+=80;bagAdd('potion',2);bagAdd('fairy',1);
      say(['Você entregou a Carta Selada!','+80 rupees, 2 poções e 1 fada.']);return 1;
    }
    if(!S.f.qx_letter){
      return say(['Mensageiro: Perdi uma carta selada nas fases do sul.','Se encontrar, traga-a até mim.'],0,[
        ['Aceitar',()=>{S.f.qx_letter='accepted';say('Mensageiro: Qualquer pista ajuda. Boa sorte!')}],
        ['Recusar',()=>say('Mensageiro: Entendo. Volte se mudar de ideia.')]
      ]);
    }
    return say('Mensageiro: Ainda sem a carta? Continue procurando nas fases novas.');
  }
  if(e.k==='n'&&e.t==='QX_MIRROR'){
    if(S.f.qx_mirror==='done')return say('O sábio já leu o que o espelho guardava.');
    if(bagGet('mirror')>0){
      S.bag.mirror--;if(S.bag.mirror<=0)delete S.bag.mirror;
      S.f.qx_mirror='done';S.ru+=100;if(S.max<8){S.max++;S.hp=S.max}
      bagAdd('elixir',1);bagAdd('green',1);
      say(['O Espelho Antigo revela uma memória da Era do Céu.','+100 rupees, +1 coração, elixir e poção verde!']);return 1;
    }
    return say(['Sábio: Procuro um Espelho Antigo perdido nas ruínas novas.','Traga-o e eu partilho o que ele mostrar.']);
  }
  if(e.k==='n'&&typeof e.t==='string'&&e.t.indexOf('QX')===0&&window.questData[e.t]){
    // already handled by previous NX, fall through
  }
  return _NXbag(e);
};

(()=>{

  amb.nodes=[];amb.bed=null;amb.kind='';
}
function ambMaster(){
  if(!AC)return null;
  if(!amb.gain){amb.gain=AC.createGain();amb.gain.gain.value=0;amb.gain.connect(AC.destination)}
  return amb.gain;
}
function noiseBuf(sec){
  const n=Math.max(1,AC.sampleRate*sec|0),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);

function ambBed(type,vol){

  const m=ambMaster(); if(!m||!AC)return;
  const now=AC.currentTime;
  // fade master in
  m.gain.cancelScheduledValues(now);
  m.gain.setValueAtTime(m.gain.value,now);
  m.gain.linearRampToValueAtTime((vol||.04)*(cfg&&cfg.vol!=null?cfg.vol:1)*(cfg&&cfg.sfx===0?0:1), now+.6);

  else if(type==='desert'){f.type='bandpass';f.frequency.value=700;f.Q.value=.3;g.gain.value=.5}
  else if(type==='ice'){f.type='highpass';f.frequency.value=1200;f.Q.value=.5;g.gain.value=.45}
  else if(type==='volcano'){f.type='lowpass';f.frequency.value=220;f.Q.value=.8;g.gain.value=.85}
  else if(type==='dungeon'){f.type='lowpass';f.frequency.value=400;f.Q.value=1.2;g.gain.value=.6}
  else if(type==='deku'){f.type='bandpass';f.frequency.value=500;f.Q.value=.9;g.gain.value=.65}
  else if(type==='night'){f.type='bandpass';f.frequency.value=2500;f.Q.value=.7;g.gain.value=.4}

  else {f.type='bandpass';f.frequency.value=1000;f.Q.value=.5;g.gain.value=.4} // field

  src.start();

function ambOneShot(kind){
  if(!AC||(cfg&&cfg.sfx===0))return;
  unlock();
  const v0=.04*(cfg&&cfg.vol!=null?cfg.vol:1);
  const now=AC.currentTime;
  if(kind==='bird'){
    const f0=1800+Math.random()*1200;
    [0,.07,.14].forEach((t,i)=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='sine'; o.frequency.setValueAtTime(f0-i*180, now+t);

      g.gain.setValueAtTime(.0001,now+t); g.gain.exponentialRampToValueAtTime(v0*.7,now+t+.02);
      g.gain.exponentialRampToValueAtTime(.0001,now+t+.15);
      o.connect(g); g.connect(AC.destination); o.start(now+t); o.stop(now+t+.18);
    });
  } else if(kind==='owl'){
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='sine'; o.frequency.setValueAtTime(420,now); o.frequency.linearRampToValueAtTime(280,now+.35);
    g.gain.setValueAtTime(.0001,now); g.gain.linearRampToValueAtTime(v0*.9,now+.05);
    g.gain.linearRampToValueAtTime(.0001,now+.45);
    o.connect(g); g.connect(AC.destination); o.start(now); o.stop(now+.5);
  } else if(kind==='cricket'){
    for(let i=0;i<5;i++){
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='square'; o.frequency.value=4200+Math.random()*800;
      const t=now+i*.04;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v0*.25,t+.01);
      g.gain.exponentialRampToValueAtTime(.0001,t+.03);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+.04);
    }
  } else if(kind==='drip'){
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='sine'; o.frequency.setValueAtTime(1200,now); o.frequency.exponentialRampToValueAtTime(600,now+.08);
    g.gain.setValueAtTime(v0*.5,now); g.gain.exponentialRampToValueAtTime(.0001,now+.12);
    o.connect(g); g.connect(AC.destination); o.start(now); o.stop(now+.15);
  } else if(kind==='wind'){
    // rajada curta via noise
    const src=AC.createBufferSource(); src.buffer=noiseBuf(.4);
    const f=AC.createBiquadFilter(),g=AC.createGain();
    f.type='bandpass'; f.frequency.value=600+Math.random()*400; f.Q.value=.4;
    g.gain.setValueAtTime(.0001,now); g.gain.linearRampToValueAtTime(v0*.8,now+.05);
    g.gain.linearRampToValueAtTime(.0001,now+.35);
    src.connect(f); f.connect(g); g.connect(AC.destination); src.start(now); src.stop(now+.4);
  } else if(kind==='ember'){
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='sawtooth'; o.frequency.setValueAtTime(80+Math.random()*40,now);
    o.frequency.exponentialRampToValueAtTime(40,now+.2);
    g.gain.setValueAtTime(v0*.35,now); g.gain.exponentialRampToValueAtTime(.0001,now+.25);
    o.connect(g); g.connect(AC.destination); o.start(now); o.stop(now+.3);
  } else if(kind==='creak'){
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(120,now); o.frequency.linearRampToValueAtTime(70,now+.4);
    g.gain.setValueAtTime(.0001,now); g.gain.linearRampToValueAtTime(v0*.4,now+.08);
    g.gain.linearRampToValueAtTime(.0001,now+.45);
    o.connect(g); g.connect(AC.destination); o.start(now); o.stop(now+.5);
  } else if(kind==='wave'){
    const src=AC.createBufferSource(); src.buffer=noiseBuf(.6);
    const f=AC.createBiquadFilter(),g=AC.createGain();
    f.type='lowpass'; f.frequency.setValueAtTime(400,now); f.frequency.linearRampToValueAtTime(900,now+.3);
    g.gain.setValueAtTime(.0001,now); g.gain.linearRampToValueAtTime(v0*.7,now+.15);
    g.gain.linearRampToValueAtTime(.0001,now+.55);
    src.connect(f); f.connect(g); g.connect(AC.destination); src.start(now); src.stop(now+.6);
  } else if(kind==='leaf'){
    const src=AC.createBufferSource(); src.buffer=noiseBuf(.2);
    const f=AC.createBiquadFilter(),g=AC.createGain();
    f.type='highpass'; f.frequency.value=3000; f.Q.value=.7;

  }
}

function ambKindForMap(){
  if(title||endd) return '';
  if(typeof wx==='function'&&wx()) return 'rain';
  const name=(D[S.map]&&D[S.map][0])||'';
  const th=D[S.map]?D[S.map][1]:2;
  if(/^Árvore Deku - /.test(name)) return 'deku';
  if(!S.day) return 'night';
  // por tema de tile
  if(th===1||th===14) return 'forest';
  if(th===10||th===15) return 'water';
  if(th===6) return 'desert';
  if(th===7) return 'ice';
  if(th===8) return 'volcano';
  if(th===5||th===11||th===4||th===0) return 'dungeon';
  if(th===9) return 'rain';
  return 'field';
}

function ambSet(kind){
  if(kind===amb.kind) {
    // atualiza volume se cfg mudou
    if(amb.gain&&AC){
      const vol=(kind==='volcano'?.05:kind==='dungeon'?.04:kind==='water'?.045:.035);
      amb.gain.gain.value=vol*(cfg&&cfg.vol!=null?cfg.vol:1)*(cfg&&cfg.sfx===0?0:1);
    }
    return;
  }
  ambStop();
  amb.kind=kind||'';
  if(!kind||title||endd) return;
  const vol=kind==='volcano'?.055:kind==='dungeon'?.045:kind==='deku'?.05:kind==='water'?.048:kind==='rain'?.04:.036;
  ambBed(kind, vol);
  amb.nextOne=60+Math.random()*90|0;
}

function ambUpdate(){
  if(!AC) return;
  // silencia se sfx off
  if(cfg&&cfg.sfx===0){ if(amb.gain) amb.gain.gain.value=0; return; }
  if(oc||mel||title||endd){ /* mantém bed baixo */ if(amb.gain) amb.gain.gain.value=Math.min(amb.gain.gain.value,.01); }
  const want=ambKindForMap();
  ambSet(want);
  if(!want||window.__dkFade) return;
  if(--amb.nextOne>0) return;
  amb.nextOne=80+Math.random()*140|0;
  // one-shots por bioma
  const table={
    forest:['bird','bird','leaf','wind'],
    field:['bird','wind','leaf','cricket'],
    night:['owl','cricket','cricket','wind'],
    water:['wave','drip','drip','wave'],
    desert:['wind','wind','ember'],
    ice:['wind','wind','creak'],
    volcano:['ember','ember','wind'],
    dungeon:['drip','drip','creak','wind'],
    deku:['creak','drip','creak','leaf'],
    rain:['wind','drip','drip']
  };
  const opts=table[want]||['wind'];
  ambOneShot(opts[Math.random()*opts.length|0]);
}

["Toque comigo a Canção da Tempestade completa: Ré Fá Dó Ré Fá Dó (teclas 2 4 8 2 4 8).","Play the full Song of Storms with me: D F C D F C (keys 2 4 8 2 4 8).","Toca conmigo la Canción de la Tormenta completa: Re Fa Do Re Fa Do (teclas 2 4 8 2 4 8).","嵐の歌を一緒に演奏しよう：レ ファ ド レ ファ ド（キー2 4 8 2 4 8）。"],
["A Canção de Zelda acalma os monstros: Lá Dó Sol, duas vezes. Teclas 6 8 5, 6 8 5.","Zelda's Lullaby calms monsters: A C G, twice. Keys 6 8 5, 6 8 5.","La Canción de Zelda calma a los monstruos: La Do Sol, dos veces. Teclas 6 8 5, 6 8 5.","ゼルダの子守歌はモンスターを鎮める：ラ ド ソ を2回。キー6 8 5、6 8 5。"],
["Este altar espera uma ocarina...","This altar awaits an ocarina...","Este altar espera una ocarina...","この祭壇はオカリナを待っている…"],
["Este templo aguarda o herói do tempo.","This temple awaits the Hero of Time.","Este templo aguarda al héroe del tiempo.","この神殿は時の勇者を待っている。"],
["Leve-a ao Salão de Ganomisgan e toque-a diante dele.","Take it to Ganomisgan's Hall and play it before him.","Llévala al Salón de Ganomisgan y tócala ante él.","ガノミスガンの間へ持って行き、彼の前で演奏せよ。"],
["Está tentando chamar a quem? Acho que está à frente do seu tempo, herói.","Who are you trying to call? I think you're ahead of your time, hero.","¿A quién intentas llamar? Creo que estás adelantado a tu tiempo, héroe.","誰を呼ぼうとしているんだ？きみは時代の先を行っているな、勇者よ。"],
["A paz voltou a este salão...","Peace has returned to this hall...","La paz ha vuelto a este salón...","この広間に平和が戻った…"],
["Só a Canção do Destino o fere de verdade: aperte B e toque! O escudo segura os projéteis.","Only the Song of Destiny truly hurts him: press B and play! The shield blocks projectiles.","Solo la Canción del Destino lo hiere de verdad: ¡pulsa B y toca! El escudo detiene los proyectiles.","彼に本当に効くのは運命の歌だけ：Bを押して演奏しよう！盾は飛び道具を防ぐ。"],
["Abra a Ocarina com B e toque: Mi Sol Si Sol Dó Si (teclas 3 5 7 5 8 7).","Open the Ocarina with B and play: E G B G C B (keys 3 5 7 5 8 7).","Abre la Ocarina con B y toca: Mi Sol Si Sol Do Si (teclas 3 5 7 5 8 7).","Bでオカリナを開き演奏：ミ ソ シ ソ ド シ（キー3 5 7 5 8 7）。"],
["Toque a Canção do Destino diante de Ganomisgan: 15 de dano! Recarrega em 20 segundos.","Play the Song of Destiny before Ganomisgan: 15 damage! Recharges in 20 seconds.","Toca la Canción del Destino ante Ganomisgan: ¡15 de daño! Se recarga en 20 segundos.","ガノミスガンの前で運命の歌を演奏：15ダメージ！20秒で再使用可能。"],
["Toque a Canção da Tempestade completa e a chuva cairá onde você quiser!","Play the full Song of Storms and rain will fall wherever you wish!","¡Toca la Canción de la Tormenta completa y la lluvia caerá donde quieras!","嵐の歌を最後まで演奏すれば、好きな場所に雨が降る！"],
["Aprenda a Canção do Destino com o Sábio.","Learn the Song of Destiny from the Sage.","Aprende la Canción del Destino con el Sabio.","賢者から運命の歌を学ぼう。"]
].forEach(a=>tx(...a));
[["As ruínas antigas... algo dorme nas profundezas.","The ancient ruins... something sleeps in the depths.","Las ruinas antiguas... algo duerme en las profundidades.","古い遺跡…深い所で何かが眠っている。"],
["A ocarina está numa caverna ao leste. Cuidado com os monstros.","The ocarina is in a cave to the east. Beware of monsters.","La ocarina está en una cueva al este. Cuidado con los monstruos.","オカリナは東の洞窟にある。モンスターに気をつけて。"],
["Sou um Kolog! A Espada dorme num baú no canto leste da clareira.","I'm a Kolog! The Sword sleeps in a chest in the east corner of the clearing.","¡Soy un Kolog! La Espada duerme en un cofre en el rincón este del claro.","ぼくはコログ！剣は広場の東のすみの宝箱で眠っているよ。"],
["Sem ela, os monstros do Campo vão te devorar.","Without it, the monsters of the Field will devour you.","Sin ella, los monstruos del Campo te devorarán.","剣がなければ、平原のモンスターに食べられちゃうよ。"],
["A Canção de Saria: Fá Lá Si (2x) ou a completa.","Saria's Song: F A B (2x) or the full one.","La Canción de Saria: Fa La Si (2x) o la completa.","サリアの歌：ファ ラ シ（2回）か、完全版。"],
["Os monstros tomaram o Campo! O Selo Real caiu num baú no sudeste.","Monsters have taken the Field! The Royal Seal fell into a chest in the southeast.","¡Los monstruos tomaron el Campo! El Sello Real cayó en un cofre al sudeste.","モンスターが平原を占領した！王家の印は南東の宝箱に落ちたぞ。"],
["Norte: Castelo. Sul: Kakariko. Leste: Lago Hylia.","North: Castle. South: Kakariko. East: Lake Hylia.","Norte: Castillo. Sur: Kakariko. Este: Lago Hylia.","北：城。南：カカリコ。東：ハイリア湖。"],
["Dizem que o herói do céu dormiu 100 anos... será você?","They say the hero of the sky slept for 100 years... could it be you?","Dicen que el héroe del cielo durmió 100 años... ¿serás tú?","空の勇者は100年眠ったという…それはきみかい？"],
["Aqui eu só vejo um pirralho de chapéu verde!","All I see here is a brat in a green cap!","¡Aquí solo veo a un mocoso con gorro verde!","ここにいるのは緑の帽子のガキだけだがな！"],
["Ao leste fica o Templo do Tempo.","The Temple of Time lies to the east.","Al este queda el Templo del Tiempo.","東に時の神殿がある。"],
["Viajante... o deserto engole os distraídos.","Traveler... the desert swallows the careless.","Viajero... el desierto se traga a los distraídos.","旅人よ…砂漠は油断した者を飲み込む。"],
["Aperte B para tocar a Ocarina. Teclas 1-8.","Press B to play the Ocarina. Keys 1-8.","Pulsa B para tocar la Ocarina. Teclas 1-8.","Bでオカリナを演奏。キー1〜8。"],
["O botão Livre deixa você ensaiar sem ativar magia.","The Free button lets you practice without triggering magic.","El botón Libre te deja ensayar sin activar magia.","フリーボタンなら魔法を発動せずに練習できる。"],
["Brrr! Dizem que o céu chora logo ao norte.","Brrr! They say the sky weeps just to the north.","¡Brrr! Dicen que el cielo llora justo al norte.","ぶるる！北ではすぐ先で空が泣いているそうだ。"],
["Use a Canção da Cura (Dó Mi Sol Mi Dó) se estiver ferido.","Use the Song of Healing (C E G E C) if you're hurt.","Usa la Canción de la Curación (Do Mi Sol Mi Do) si estás herido.","ケガをしたら癒しの歌（ド ミ ソ ミ ド）を使おう。"],
["Sou um Goron! Aqui esquenta, mas o Sábio do Destino está perto.","I'm a Goron! It gets hot here, but the Sage of Destiny is near.","¡Soy un Goron! Aquí hace calor, pero el Sabio del Destino está cerca.","おれはゴロン！ここは暑いが、運命の賢者はすぐ近くだ。"],
["Cuidado: o chefe final se cura e mira à frente de você. O escudo ajuda.","Careful: the final boss heals and aims ahead of you. The shield helps.","Cuidado: el jefe final se cura y apunta por delante de ti. El escudo ayuda.","気をつけろ：ラスボスは回復し、先読みして狙ってくる。盾が役に立つ。"],
["Este templo guarda as lágrimas da deusa.","This temple keeps the goddess's tears.","Este templo guarda las lágrimas de la diosa.","この神殿には女神の涙が眠っている。"],
["A Ocarina responde a quem tem coragem.","The Ocarina answers those with courage.","La Ocarina responde a quien tiene valor.","オカリナは勇気ある者に応える。"],
["Uuuuh... eu era um herói como você.","Ooooh... I was a hero just like you.","Uuuuh... yo era un héroe como tú.","うぅぅ…わしもきみのような勇者だったのだ。"],
["O Sábio aguarda mais adiante. Prepare o coração.","The Sage awaits further ahead. Steel your heart.","El Sabio aguarda más adelante. Prepara el corazón.","賢者はこの先で待っている。覚悟を決めよ。"],
["O vento sussurra: a última prova está logo acima.","The wind whispers: the final trial is just above.","El viento susurra: la última prueba está justo arriba.","風がささやく：最後の試練はすぐ上だ。"],
["Lá você aprenderá a Canção do Destino.","There you will learn the Song of Destiny.","Allí aprenderás la Canción del Destino.","そこで運命の歌を学ぶことになる。"],
["Pesco neste lago desde a Era do Céu.","I've fished in this lake since the Sky Era.","Pesco en este lago desde la Era del Cielo.","空の時代からこの湖で釣りをしているんだ。"],
["Norte: Domínio Zora. Sul: Rancho Lon Lon.","North: Zora's Domain. South: Lon Lon Ranch.","Norte: Dominio Zora. Sur: Rancho Lon Lon.","北：ゾーラの里。南：ロンロン牧場。"],
["As águas lembram a voz da Princesa.","The waters remember the Princess's voice.","Las aguas recuerdan la voz de la Princesa.","水は姫の声を覚えている。"],
["Leve este coração. Ganomisgan não espera misericórdia.","Take this heart. Ganomisgan expects no mercy.","Toma este corazón. Ganomisgan no espera misericordia.","このハートを持っていけ。ガノミスガンに慈悲は通じない。"],
["Sou Malon! Muito prazer em conhecê-lo!","I'm Malon! Nice to meet you!","¡Soy Malon! ¡Mucho gusto en conocerte!","わたしはマロン！はじめまして！"],
["Tem uma canção que minha mãe cantava à mim... se estiver interessado, a canção é: Dó Lá Sol (2x).","There's a song my mother used to sing to me... if you're interested, it goes: C A G (2x).","Hay una canción que mi madre me cantaba... si te interesa, es: Do La Sol (2x).","母がよく歌ってくれた歌があるの…よかったら教えるね：ド ラ ソ（2回）。"],
["Esta caverna é enorme e escura...","This cave is huge and dark...","Esta cueva es enorme y oscura...","この洞窟は広くて暗い…"],
["Um galho útil está num baú por aqui. A Ocarina fica mais adiante, na clareira.","A useful stick is in a chest around here. The Ocarina is further ahead, in the clearing.","Hay una rama útil en un cofre por aquí. La Ocarina está más adelante, en el claro.","役に立つ枝がこの辺りの宝箱にある。オカリナはもっと先の広場だ。"],
["Este vale leva ao Campo. Mas há um atalho secreto ao norte se você tiver a canção certa...","This valley leads to the Field. But there's a secret shortcut to the north if you know the right song...","Este valle lleva al Campo. Pero hay un atajo secreto al norte si conoces la canción correcta...","この谷は平原へ続く。だが正しい歌を知っていれば、北に秘密の近道がある…"],
["A ponte caiu! Só quem tem coragem (e a espada) passa.","The bridge has fallen! Only the brave (with a sword) can pass.","¡El puente cayó! Solo pasa quien tiene valor (y espada).","橋が落ちた！勇気のある者（と剣）だけが通れる。"],
["Side quest: mate todos os monstros daqui e eu te dou um frasco.","Side quest: kill all the monsters here and I'll give you a bottle.","Misión secundaria: mata a todos los monstruos de aquí y te daré un frasco.","サブクエスト：ここのモンスターを全部倒したら、びんをあげよう。"],
["Ruínas de uma era passada. Dizem que um herói deixou algo escondido.","Ruins of a bygone era. They say a hero left something hidden.","Ruinas de una era pasada. Dicen que un héroe dejó algo escondido.","過ぎ去った時代の遺跡。勇者が何かを隠したという。"],
["Você encontrou o caminho secreto! Continue para o norte.","You found the secret path! Keep going north.","¡Encontraste el camino secreto! Sigue hacia el norte.","秘密の道を見つけた！北へ進もう。"],
["Do alto se vê o Castelo... e a sombra de Ganomisgan.","From up here you can see the Castle... and Ganomisgan's shadow.","Desde lo alto se ve el Castillo... y la sombra de Ganomisgan.","高い所から城が見える…そしてガノミスガンの影も。"],
["Kologs escondem tesouros. Mate 5 monstros no total e volte para uma recompensa especial.","Kologs hide treasures. Defeat 5 monsters in total and return for a special reward.","Los Kolog esconden tesoros. Mata a 5 monstruos en total y vuelve por una recompensa especial.","コログは宝を隠している。モンスターを合計5体倒して戻れば、特別なごほうびをあげよう。"]
].forEach(a=>tx(...a));

[["Toque a Canção do Vento para viajar mais rápido.","Play the Song of Wind to travel faster.","Toca la Canción del Viento para viajar más rápido.","風の歌を演奏すれば、より速く移動できる。"],
["Nestas colinas há pedras que escondem baús.","There are rocks on these hills that hide chests.","En estas colinas hay piedras que esconden cofres.","この丘には宝箱を隠す岩がある。"],
["Use a Canção da Revelação.","Use the Song of Revelation.","Usa la Canción de la Revelación.","あばきの歌を使ってみよう。"],
["Mais fundo na caverna... Dizem que há um baú enterrado em algum lugar por aqui.","Deeper in the cave... They say a buried chest lies somewhere around here.","Más adentro de la cueva... Dicen que hay un cofre enterrado por aquí.","洞窟のさらに奥…どこかに埋もれた宝箱があるそうだ。"],
["Muitos se perdem aqui... a Canção de Saria ajuda a encontrar o caminho.","Many get lost here... Saria's Song helps find the way.","Muchos se pierden aquí... la Canción de Saria ayuda a hallar el camino.","ここで迷う者は多い…サリアの歌が道しるべになる。"],
["As águas sagradas restauram a alma.","The sacred waters restore the soul.","Las aguas sagradas restauran el alma.","聖なる水は魂を癒す。"],
["Toque a Canção da Vida perto da água.","Play the Song of Life near the water.","Toca la Canción de la Vida cerca del agua.","水辺で命の歌を演奏しよう。"],
["Cristais brilham quando a Canção da Luz é tocada.","Crystals glow when the Song of Light is played.","Los cristales brillan al tocar la Canción de la Luz.","光の歌を演奏すると水晶が輝く。"],
["Sombra e silêncio... a Canção da Sombra paralisa os que espreitam.","Shadow and silence... the Song of Shadow paralyzes those who lurk.","Sombra y silencio... la Canción de la Sombra paraliza a quienes acechan.","闇と静寂…影の歌は潜む者を麻痺させる。"],
["Este templo guarda o conhecimento das canções antigas.","This temple holds the knowledge of the ancient songs.","Este templo guarda el conocimiento de las canciones antiguas.","この神殿には古の歌の知識が眠っている。"],
["O frio corta a pele. A Canção da Proteção ajuda.","The cold cuts the skin. The Song of Protection helps.","El frío corta la piel. La Canción de la Protección ayuda.","寒さが肌を刺す。守りの歌が助けになる。"],
["Aqui as deusas ouvem as canções. Toque a Canção do Destino quando estiver pronto.","Here the goddesses hear the songs. Play the Song of Destiny when you are ready.","Aquí las diosas escuchan las canciones. Toca la Canción del Destino cuando estés listo.","ここでは女神が歌に耳を傾ける。準備ができたら運命の歌を演奏せよ。"],
["O grande Campo de Hyrule se estende em todas as direções. Explore livremente.","The great Hyrule Field stretches in every direction. Explore freely.","El gran Campo de Hyrule se extiende en todas direcciones. Explora libremente.","広大なハイラル平原は四方に広がっている。自由に探検しよう。"],
["Os Kologs guardam segredos da floresta. Explore todos os caminhos.","The Kologs keep the forest's secrets. Explore every path.","Los Kolog guardan los secretos del bosque. Explora todos los caminos.","コログは森の秘密を守っている。すべての道を探索しよう。"],
["Um oásis no deserto. Descanse aqui.","An oasis in the desert. Rest here.","Un oasis en el desierto. Descansa aquí.","砂漠のオアシス。ここで休もう。"],
["Templo da Chama. O guardião do fogo aguarda no altar.","Temple of Flame. The fire guardian waits at the altar.","Templo de la Llama. El guardián del fuego aguarda en el altar.","炎の神殿。炎の守護者が祭壇で待っている。"],
["Templo das profundezas. Cuidado com as correntes e o guardião.","Temple of the Depths. Beware the currents and the guardian.","Templo de las profundidades. Cuidado con las corrientes y el guardián.","深淵の神殿。流れと守護者に気をつけろ。"],
["Templo da Floresta. As raízes antigas protegem o boss.","Forest Temple. Ancient roots protect the boss.","Templo del Bosque. Las raíces antiguas protegen al jefe.","森の神殿。古い根がボスを守っている。"],
["O vento sopra, mas não há portal aqui...","The wind blows, but there is no portal here...","El viento sopla, pero aquí no hay portal...","風は吹くが、ここにワープの入口はない…"],
["A força ainda queima em você...","The strength still burns within you...","La fuerza aún arde en ti...","力はまだきみの中で燃えている…"],
["As notas ecoam... o templo ainda não as ensinou.","The notes echo... the temple has not taught them yet.","Las notas resuenan... el templo aún no las ha enseñado.","音が響く…神殿はまだこの曲を教えていない。"],
["♪ A canção de Saria ecoa pela floresta... ♪","♪ Saria's song echoes through the forest... ♪","♪ La canción de Saria resuena por el bosque... ♪","♪ サリアの歌が森にこだまする… ♪"],
["Já está no máximo de corações!","Your hearts are already at maximum!","¡Ya tienes el máximo de corazones!","ハートはもう最大だ！"],
["O Escudo Hyliano! Olhe para o golpe para bloquear.","The Hylian Shield! Face the blow to block.","¡El Escudo Hyliano! Mira hacia el golpe para bloquear.","ハイリアの盾だ！攻撃の方を向いて防ごう。"],
["Frasco de Coração (40): +1 coração","Heart Container (40): +1 heart","Frasco de Corazón (40): +1 corazón","ハートの器（40）：ハート+1"]
].forEach(a=>tx(...a));

[["Esse é o Selo Real! Passe, herói. Que as deusas o protejam.","That's the Royal Seal! Pass, hero. May the goddesses protect you.","¡Ese es el Sello Real! Pasa, héroe. Que las diosas te protejan.","それは王家の印！通れ、勇者よ。女神のご加護を。"],
["Boa sorte, herói!","Good luck, hero!","¡Buena suerte, héroe!","幸運を、勇者よ！"],
["Modo Livre: toque à vontade, nada será ativado.","Free Mode: play freely, nothing will be triggered.","Modo Libre: toca a tu gusto, nada se activará.","フリーモード：自由に演奏しよう。何も発動しない。"],
["Toque a Canção de Zelda: Lá Dó Sol, duas vezes (teclas 6 8 5, 6 8 5).","Play Zelda's Song: A C G, twice (keys 6 8 5, 6 8 5).","Toca la Canción de Zelda: La Do Sol, dos veces (teclas 6 8 5, 6 8 5).","ゼルダの歌を演奏：ラ ド ソ を2回（キー6 8 5、6 8 5）。"],
["Impressionante! Os espíritos te abençoam.","Impressive! The spirits bless you.","¡Impresionante! Los espíritus te bendicen.","見事だ！精霊たちがそなたを祝福する。"],
["Os espíritos abençoam quem derrota muitos monstros.","The spirits bless those who defeat many monsters.","Los espíritus bendicen a quien derrota a muchos monstruos.","精霊は多くのモンスターを倒した者を祝福する。"],
["Mate 5 no total e volte.","Defeat 5 in total and come back.","Derrota a 5 en total y vuelve.","合計5体倒してから戻ってこい。"],
["Aperte A para jogar de novo","Press A to play again","Pulsa A para jugar de nuevo","Aでもう一度あそぶ"],
["Você aprendeu a CANÇÃO DA TEMPESTADE!","You learned the SONG OF STORMS!","¡Aprendiste la CANCIÓN DE LA TORMENTA!","嵐の歌を覚えた！"],
["Toque a primeira parte ou a completa para chamar/acalmar a chuva.","Play the first part or the full song to call or calm the rain.","Toca la primera parte o la completa para llamar o calmar la lluvia.","前半または全曲を演奏すると、雨を呼ぶ・止ませることができる。"],
["Você aprendeu a CANÇÃO DE ZELDA!","You learned ZELDA'S SONG!","¡Aprendiste la CANCIÓN DE ZELDA!","ゼルダの歌を覚えた！"],
["Os monstros se acalmam ao ouvi-la.","Monsters calm down when they hear it.","Los monstruos se calman al oírla.","モンスターはこの歌を聴くと落ち着く。"],
["Leve-a ao Salão de Ganomisgan e toque-a diante dele.","Take it to Ganomisgan's Hall and play it before him.","Llévala al Salón de Ganomisgan y tócala ante él.","ガノミスガンの間へ行き、彼の前で演奏しよう。"],
["A magia ainda descansa...","The magic is still resting...","La magia aún descansa...","魔法はまだ休んでいる…"],
["Canção da Cura: +2 corações!","Song of Healing: +2 hearts!","Canción de la Curación: ¡+2 corazones!","癒しの歌：ハート+2！"],
["Algo impede a tempestade aqui...","Something blocks the storm here...","Algo impide la tormenta aquí...","ここでは何かが嵐を妨げている…"],
["Aqui a chuva nunca para...","The rain never stops here...","Aquí la lluvia nunca cesa...","ここでは雨が止むことはない…"],
["Canção do Sol: a luz fere os monstros!","Sun's Song: the light hurts the monsters!","Canción del Sol: ¡la luz hiere a los monstruos!","太陽の歌：光がモンスターを傷つける！"],
["Canção da Força: seus ataques ficam mais fortes!","Song of Strength: your attacks grow stronger!","Canción de la Fuerza: ¡tus ataques se hacen más fuertes!","力の歌：こうげきが強くなる！"],
["A proteção ainda está ativa...","The protection is still active...","La protección sigue activa...","守りはまだ続いている…"],
["Canção da Proteção: escudo mágico!","Song of Protection: magic shield!","Canción de la Protección: ¡escudo mágico!","守りの歌：魔法のバリア！"],
["Canção da Revelação: baús ocultos brilham!","Song of Revelation: hidden chests glow!","Canción de la Revelación: ¡los cofres ocultos brillan!","あばきの歌：隠れた宝箱が光る！"],
["Nada novo para revelar aqui...","Nothing new to reveal here...","Nada nuevo que revelar aquí...","ここには暴くものはない…"],
["Canção do Vento: você é levado pelo ar!","Song of Wind: you are carried through the air!","Canción del Viento: ¡el aire te lleva!","風の歌：風に運ばれる！"],
["Canção da Luz: cura e acalma!","Song of Light: heals and calms!","Canción de la Luz: ¡cura y calma!","光の歌：癒やして静める！"],
["Canção da Sombra: os monstros congelam de medo!","Song of Shadow: monsters freeze in fear!","Canción de la Sombra: ¡los monstruos se congelan de miedo!","影の歌：モンスターが恐怖で凍りつく！"],
["Canção da Vida: vida totalmente restaurada!","Song of Life: health fully restored!","Canción de la Vida: ¡vida totalmente restaurada!","命の歌：体力が全回復！"],
["O Destino ainda se recompõe...","Destiny is still recovering...","El Destino aún se recompone...","運命はまだ力を取り戻している…"],
["CANÇÃO DO DESTINO! -15 de vida!","SONG OF DESTINY! -15 HP!","¡CANCIÓN DEL DESTINO! ¡-15 de vida!","運命の歌！ -15ダメージ！"],
["Canção do Sol: o dia amanhece! A luz fere as sombras.","Sun's Song: day breaks! The light wounds the shadows.","Canción del Sol: ¡amanece! La luz hiere a las sombras.","太陽の歌：夜が明ける！光が影を傷つける。"],
["Canção do Sol: o tempo avança e a noite cai...","Sun's Song: time moves on and night falls...","Canción del Sol: el tiempo avanza y cae la noche...","太陽の歌：時が進み、夜が訪れる…"],
["Descanse, herói. A luz do santuário restaura sua vida.","Rest, hero. The shrine's light restores your health.","Descansa, héroe. La luz del santuario restaura tu vida.","休むがよい、勇者よ。祠の光が体力を癒やす。"],
["Obrigado de novo, herói!","Thanks again, hero!","¡Gracias de nuevo, héroe!","重ねてありがとう、勇者よ！"],
["Já cuidei disso, obrigado!","I've taken care of that, thanks!","¡Ya me ocupé de eso, gracias!","もう片付いたよ、ありがとう！"],
["Alto! A Floresta Kokiri clama por ajuda.","Halt! The Kokiri Forest cries out for help.","¡Alto! El Bosque Kokiri clama ayuda.","止まれ！コキリの森は助けを求めている。"],
["Só quem purificou a Grande Árvore Deku merece o Selo Real.","Only one who purified the Great Deku Tree deserves the Royal Seal.","Solo quien purificó al Gran Árbol Deku merece el Sello Real.","デクの樹サマを浄化した者だけが王家の印にふさわしい。"],
["Parado aí! Aqui só entra quem a Saria autoriza.","Stop right there! Only those Saria allows may enter here.","¡Alto ahí! Aquí solo entra quien Saria autoriza.","止まれ！ここはサリアが認めた者しか入れない。"],
["A Grande Árvore Deku fica ao norte da vila. Entre nela — o mal está no núcleo.","The Great Deku Tree is north of the village. Enter it — the evil is at its core.","El Gran Árbol Deku está al norte de la aldea. Entra en él: el mal está en su núcleo.","デクの樹サマは村の北にある。中へ入れ――悪は核にいる。"],
["Se a mata te confundir, toque a Canção de Saria: Fá Lá Si, duas vezes.","If the woods confuse you, play Saria's Song: F A B, twice.","Si el bosque te confunde, toca la Canción de Saria: Fa La Si, dos veces.","森で迷ったらサリアの歌を：ファ ラ シ を2回。"],
["Ao norte do Bosque Faron, a luz some entre copas imensas. É a Floresta Kokiri.","North of Faron Woods, the light fades among huge treetops. This is the Kokiri Forest.","Al norte del Bosque Faron, la luz se pierde entre copas inmensas. Es el Bosque Kokiri.","ファロンの森の北では、巨大な木々の間で光が消える。ここがコキリの森だ。"],
["Link sente a espada tremer. Algo antigo chama dentro da mata.","Link feels the sword tremble. Something ancient calls from within the woods.","Link siente que la espada tiembla. Algo antiguo llama desde el bosque.","リンクは剣が震えるのを感じた。森の奥で古い何かが呼んでいる。"],
["Link, eu sentia que vinha.","Link, I felt you were coming.","Link, sentía que vendrías.","リンク、おぬしが来るのを感じておった。"],
["Hmm! Um humano nas Montanhas! Faz cem anos que ninguém sobe aqui.","Hmm! A human in the Mountains! No one has climbed here in a hundred years.","¡Hmm! ¡Un humano en las Montañas! Hace cien años que nadie sube aquí.","ふむ！山に人間とは！百年、誰もここへ登っていない。"],
["O vulcão ruge desde que o herói adormeceu. Dizem que um dragão acordou lá embaixo.","The volcano has roared since the hero fell asleep. They say a dragon awoke down below.","El volcán ruge desde que el héroe se durmió. Dicen que un dragón despertó allá abajo.","勇者が眠ってから火山は唸り続けている。下で竜が目覚めたという。"],
["Se acalmar o Covil Vulcânico, os Gorons te chamarão de irmão.","If you calm the Volcanic Lair, the Gorons will call you brother.","Si calmas la Guarida Volcánica, los Gorons te llamarán hermano.","火山の巣を鎮めれば、ゴロンたちはおぬしを兄弟と呼ぶだろう。"],
["Sou Ruto, filha do Rei Zora. As águas já cantaram para a Princesa Zelda...","I am Ruto, daughter of the Zora King. The waters once sang for Princess Zelda...","Soy Ruto, hija del Rey Zora. Las aguas cantaron una vez para la Princesa Zelda...","わたくしはルト、ゾーラ王の娘。水はかつてゼルダ姫のために歌ったわ…"],
["Hoje elas gemem. A sombra suja o rio até o mar.","Today they moan. The shadow fouls the river all the way to the sea.","Hoy gimen. La sombra ensucia el río hasta el mar.","今は水がうめいている。影が川を海まで汚しているの。"],
["Cuidado nos charcos: criaturas saltam e cospem pedras.","Beware the puddles: creatures leap out and spit rocks.","Cuidado con los charcos: criaturas saltan y escupen piedras.","水たまりに注意：モンスターが跳び出して石を吐くわ。"],
["O deserto engoliu três caravanas desde que a sombra cresceu.","The desert has swallowed three caravans since the shadow grew.","El desierto se tragó tres caravanas desde que la sombra creció.","影が広がってから、砂漠は三つのキャラバンを飲み込んだ。"],
["Se vir um lobo cinzento rosnando, dê um passo ao lado: ele ataca em linha reta.","If you see a growling gray wolf, step aside: it charges in a straight line.","Si ves un lobo gris gruñendo, da un paso al lado: ataca en línea recta.","唸る灰色のオオカミを見たら横に避けろ。まっすぐ突進してくる。"],
["A terra treme. Um rugido seco rasga o ar.","The ground shakes. A dry roar tears through the air.","La tierra tiembla. Un rugido seco rasga el aire.","大地が揺れる。乾いた咆哮が空気を裂く。"],
["Herói adormecido... cada selo que quebrar só me aproxima da Ocarina.","Sleeping hero... every seal you break only brings me closer to the Ocarina.","Héroe dormido... cada sello que rompas solo me acerca a la Ocarina.","眠れる勇者よ…封印を解くたび、オカリナは私に近づく。"],
["Link aperta o punho. O Covil do Dragão aguarda adiante.","Link clenches his fist. The Dragon's Lair awaits ahead.","Link aprieta el puño. La Guarida del Dragón aguarda más adelante.","リンクは拳を握る。竜の巣はすぐ先だ。"],
["Congelei aqui para esperar o herói. A Era do Céu ainda sussurra nestas pedras.","I froze here to wait for the hero. The Skyward Age still whispers in these stones.","Me congelé aquí para esperar al héroe. La Era del Cielo aún susurra en estas piedras.","勇者を待つためここで凍りついた。空の時代はまだこの石にささやいている。"],
["A Fortaleza guarda o último eco da Canção do Destino. Ganomisgan a teme.","The Fortress holds the last echo of the Song of Destiny. Ganomisgan fears it.","La Fortaleza guarda el último eco de la Canción del Destino. Ganomisgan la teme.","砦には運命の歌の最後のこだまが眠る。ガノミスガンはそれを恐れている。"],
["Cuidado com arqueiros: eles recuam e disparam.","Beware of archers: they back away and shoot.","Cuidado con los arqueros: retroceden y disparan.","弓兵に注意：下がりながら撃ってくる。"],

// 1. TRANSIÇÃO DE TELAS ESTILO A LINK TO THE PAST
// =====================================================================
let TR15={active:0,phase:0,timer:0,destMap:0,destX:0,destY:0,color:'#000',flash:0,bypass:0,fromGo:0};
window.__TR15=TR15; // exposto p/ o v24 não congelar o fade durante diálogos
const TR15_DURATION=18; // frames do fade

// Intercepta load() para adicionar transição
const _loadV14=load;
load=function(i,x,y){
  if(TR15.bypass)return _loadV14(i,x,y);
  if(!TR15.fromGo){
    if(TR15.active){TR15.active=0;TR15.phase=0;TR15.timer=0}
    return _loadV14(i,x,y);
  }
  if(TR15.active)return;
  TR15.fromGo=0;
  // Escolhe cor de flash baseado no bioma do destino
  const bt=D[i]?D[i][1]:0;
  const flashColors=['#c8f0c8','#88cc44','#44aa66','#ddcc88','#aabbcc','#8866aa',
                     '#ddcc66','#eef8ff','#cc6644','#44998a','#4488cc','#555566',
                     '#99aabb','#eedd88','#66aa44','#4499cc'];
  TR15.color=flashColors[bt]||'#c8e8c8';
  TR15.destMap=i; TR15.destX=x; TR15.destY=y;
  TR15.active=1; TR15.phase=0; TR15.timer=TR15_DURATION; TR15.flash=0;
};

// Carregamento síncrono: init/loadGame/fades próprios não entram no wipe de sala.
function rawLoad(i,x,y){
  const tr=window.__TR15;
  if(!tr)return load(i,x,y);
  const was=tr.bypass;
  tr.active=0;tr.phase=0;tr.timer=0;tr.bypass=1;
  try{return load(i,x,y)}
  finally{tr.bypass=was;tr.active=0;tr.phase=0;tr.timer=0}
}
window.__LBD_RAW_LOAD__=rawLoad;

// Hook no draw para renderizar a transição por cima de tudo
const _drawTR14=draw;
draw=function(){
  _drawTR14();
  if(!TR15.active)return;
  // O wipe sempre é composto em coordenadas lógicas e em source-over,
  // isolado de clips, transforms e modos multiply deixados por wrappers antigos.
  g.save();
  try{
    g.setTransform(1,0,0,1,0,0);
    g.globalCompositeOperation='source-over';
    g.globalAlpha=1;
    const p=Math.max(0,Math.min(1,TR15.timer/TR15_DURATION));
    if(TR15.phase===0){
      const a=1-p;
      R('rgba(0,0,0,'+a+')',0,0,240,208);
      if(TR15.flash>0){
        g.globalAlpha=Math.max(0,Math.min(1,TR15.flash/8*a));
        R(TR15.color,0,0,240,208);
        TR15.flash--;
      }
    }else{
      R('rgba(0,0,0,'+p+')',0,0,240,208);
    }
  }finally{g.restore()}
};

// Mantido como fallback para chamadas internas anteriores ao hub final.
const _updTR14=upd;
upd=function(){
  if(TR15.active){
    fr++;
    TR15.timer--;
    if(TR15.timer<=0){
      if(TR15.phase===0){
        TR15.flash=6;
        try{
          rawLoad(TR15.destMap,TR15.destX,TR15.destY);
          TR15.phase=1;
          TR15.timer=TR15_DURATION;
        }catch(err){
          console.error('[LBD TR15] Falha ao carregar destino da transição:',err);
          TR15.active=0;TR15.phase=0;TR15.timer=0;
        }
      }else{TR15.active=0;TR15.phase=0;TR15.timer=0}
    }
    return;
  }
  _updTR14();
};

// Entidades de puzzle (alavancas, blocos push, etc.)
function buildPuzzles(mapId){
  const puzzles=PUZZLES[mapId];
  if(!puzzles)return;
  puzzles.forEach(pz=>{
    if(pz.type==='switch'&&!S.pz[pz.id]){
      ents.push({k:'switch',x:pz.sx*T,y:pz.sy*T,inv:0,pz,id:'switch_'+pz.id});
    }
    if(pz.type==='pushblock'&&!S.pz[pz.id]){
      ents.push({k:'pushblock',x:pz.px*T,y:pz.py*T,inv:0,pz,id:'pushblock_'+pz.id,
        tx:pz.tx*T,ty:pz.ty*T});
    }
    if(pz.type==='pressure'&&!S.pz[pz.id]){
      ents.push({k:'pressure',x:pz.px*T,y:pz.py*T,inv:0,pz,id:'pressure_'+pz.id,active:0});
    }
    if(pz.type==='torch'&&!S.pz[pz.id]){
      ents.push({k:'torch',x:pz.tx*T,y:pz.ty*T,inv:0,pz,id:'torch_'+pz.id,lit:0});
    }
    if(pz.type==='dark'&&!S.pz[pz.id+'_clear']){
      ents.push({k:'darkveil',x:0,y:0,inv:0,pz,id:'dark_'+pz.id});
    }
    // Baú especial de puzzle (pressão)
    if(pz.type==='pressure'&&pz.chestId&&!S.f[pz.chestId]&&S.pz[pz.id]){
      ents.push({k:'c',x:pz.chestX*T,y:pz.chestY*T,inv:0,id:pz.chestId});

// Empurrar bloco: quando Link ataca na direção do bloco
const _doAPZ=doA;
// Detecta blocos push ao atacar
doA=function(){
  const fx=px+8+[0,0,-12,12][dir],fy=py+8+[12,-12,0,0][dir];
  const pb15=ents.find(e=>e.k==='pushblock'&&Math.abs(e.x+8-fx)<14&&Math.abs(e.y+8-fy)<14);
  if(pb15&&!S.pz[pb15.pz.id]){
    // Empurra na direção de Link
    const dx2=[0,0,-1,1][dir]*T;
    const dy2=[1,-1,0,0][dir]*T;
    const nx2=pb15.x+dx2,ny2=pb15.y+dy2;
    if(!bl(nx2+2,ny2+4,12,10)){
      pb15.x=nx2;pb15.y=ny2;
      sfx(180,'square',.12,.08);
    }
    return;
  }
  // Tocha: acende com ataque + Ocarina aberta ou com Canção do Sol ativa
  const torch=ents.find(e=>e.k==='torch'&&!e.lit&&Math.abs(e.x+8-fx)<14&&Math.abs(e.y+8-fy)<14);
  if(torch&&(S.oca||S.lt>0)){
    torch.lit=1;
    S.pz[torch.pz.id]=1;
    sfx(600,'sawtooth',.15,.08);
    fl('Tocha acesa!');
    // Verifica se todas as tochas desta sala estão acesas
    const allLit=ents.filter(e=>e.k==='torch').every(e=>e.lit||S.pz[e.pz.id]);
    if(allLit){
      fl('Todas as tochas acesas! A porta se abre.');
      sfx(880,'triangle',.3,.1);
      // Libera passagem norte
      if(G[0])for(let k=6;k<9;k++)if(G[0][k]==='#')G[0][k]='.';
    }
    return;
  }
  // Alavanca interativa
  const sw15=ents.find(e=>e.k==='switch'&&Math.abs(e.x+8-fx)<14&&Math.abs(e.y+8-fy)<14);
  if(sw15){
    S.pz[sw15.pz.id]=!S.pz[sw15.pz.id];
    sw15.on=S.pz[sw15.pz.id];
    sfx(sw15.on?660:300,'square',.12,.08);
    fl(sw15.on?'Alavanca ativada! Blocos se moveram.':'Alavanca desativada.');
    // Atualiza grid
    const p=sw15.pz;
    for(let bx2=p.bx;bx2<p.bx+p.bw;bx2++)
      for(let by2=p.by;by2<p.by+p.bh;by2++)
        if(G[by2]&&G[by2][bx2]!==undefined)
          G[by2][bx2]=sw15.on?'.':'#';
    return;
  }
  _doAPZ();
};

lembrança que Zelda escondeu. Mas o conhecimento tem um preço.":["Traveler: I can reveal a memory Zelda concealed. But knowledge comes at a price.","Viajera: Puedo revelar un recuerdo que Zelda ocultó. Pero el conocimiento tiene un precio.","旅人：ゼルダが隠した記憶を明かしてあげよう。ただし、知識には代償がある。"],"Você aceita trocar parte da sua energia por essa verdade?":["Will you trade some of your energy for this truth?","¿Aceptas intercambiar parte de tu energía por esta verdad?","この真実のために、自分の力の一部を差し出すか？"],"Aceitar o pacto":["Accept the pact","Aceptar el pacto","契約を受け入れる"],"Viajante: Então escute: Zelda não teme o futuro. Ela teme que você precise enfrentá-lo sozinho.":["Traveler: Then listen: Zelda does not fear the future. She fears that you may have to face it alone.","Viajera: Entonces escucha: Zelda no teme al futuro. Teme que tengas que afrontarlo a solas.","旅人：ならば聞きなさい。ゼルダが恐れているのは未来ではない。あなたが一人で立ち向かわねばならないことよ。"],"Você recebeu 120 rupees, mas perdeu 1 coração.":["You received 120 rupees, but lost 1 heart.","Recibiste 120 rupias, pero perdiste 1 corazón.","120ルピーを受け取ったが、ハートを1つ失った。"],"Link: Não farei um acordo sem saber toda a verdade.\nViajante: Justo. A escolha também é uma forma de coragem.":["Link: I will not make a deal without knowing the whole truth.\nTraveler: Fair enough. Choosing is also a form of courage.","Link: No haré un trato sin conocer toda la verdad.\nViajera: Justo. Elegir también es una forma de valentía.","リンク：すべての真実を知らずに取引はしない。\n旅人：もっともね。選ぶこともまた勇気の一つよ。"],"Viajante: Não precisa decidir agora. Estarei aqui enquanto a névoa durar.":["Traveler: You don't have to decide now. I'll be here as long as the mist remains.","Viajera: No tienes que decidir ahora. Estaré aquí mientras dure la niebla.","旅人：今すぐ決める必要はない。霧が晴れるまで、ここにいるわ。"],"Você encontrou um objeto importante!":["You found an important item!","¡Encontraste un objeto importante!","大切なアイテムを見つけた！"],"+20 rupees.":["+20 rupees.","+20 rupias.","20ルピー獲得。"],"Vida já está cheia.":["Your health is already full.","Ya tienes toda la sem a carta? Continue procurando nas fases novas.":["Messenger: Still no letter? Keep searching through the new stages.","Mensajero: ¿Aún no tienes la carta? Sigue buscando en las nuevas fases.","伝令：まだ手紙は見つからないか？新しいエリアを探し続けてくれ。"],"O sábio já leu o que o espelho guardava.":["The sage has already read what the mirror held.","El sabio ya ha leído lo que guardaba el espejo.","賢者はすでに鏡が秘めていたものを読み解いた。"],"O Espelho Antigo revela uma memória da Era do Céu.":["The Ancient Mirror reveals a memory from the Sky Era.","El Espejo Antiguo revela un recuerdo de la Era del Cielo.","古の鏡が空の時代の記憶を映し出す。"],"+100 rupees, +1 coração, elixir e poção verde!":["+100 rupees, +1 heart, an elixir and a green potion!","+100 rupias, +1 corazón, ¡un elixir y una poción verde!","100ルピー、ハート+1、エリクサー、緑の薬を手に入れた！"],"Sábio: Procuro um Espelho Antigo perdido nas ruínas novas.":["Sage: I am searching for an Ancient Mirror lost in the new ruins.","Sabio: Busco un Espejo Antiguo perdido en las nuevas ruinas.","賢者：新たな遺跡で失われた古の鏡を探している。"],"Traga-o e eu partilho o que ele mostrar.":["Bring it to me, and I will share what it reveals.","Tráemelo y compartiré contigo lo que revele.","それを持ってきてくれ。映し出されたものをそなたにも見せよう。"],"Itens: bomba e poção!":["Items: bomb and potion!","¡Objetos: bomba y poción!","アイテム：爆弾と薬！"],"Itens: semente e poção verde!":["Items: seed and green potion!","¡Objetos: semilla y poción verde!","アイテム：タネと緑の薬！"],"+1 coração!":["+1 heart!","+1 corazón!","ハート+1！"],"Você encontrou uma CARTA SELADA!":["You found a SEALED LETTER!","¡Encontraste una CARTA SELLADA!","封印された手紙を見つけた！"],"Coloque no inventário (I) e entregue ao mensageiro.":["Put it in your inventory (I) and deliver it to the messenger.","Guárdala en el inventario (I) y entrégasela al mensajero.","インベントリ（I）に入れて、伝令に届けよう。"],"Você encontrou o ESPELHO ANTIGO!":["You found the ANCIENT MIRROR!","¡Encontraste el ESPEJO ANTIGUO!","古の鏡を見つけた！"],"Leve-o ao sábio na Ruína do Espelho.":["Take it to the sage at the Mirror Ruin.","Llévalo al sabio de la Ruina del Espejo.","鏡の遺跡にいる賢者に届けよう。"],"Loja de Kakariko — itens vão para o inventário (tecla I).":["Kakariko Shop — purchased items go into your inventory (I key).","Tienda de Kakariko: los objetos comprados van al inventario (tecla I).","カカリコの店：購入したアイテムはインベントリに入る（Iキー）。"],"Dentro da Árvore, o ar é úmido e pesa como seiva.":["Inside the Tree, the air is damp and heavy as sap.","Dentro del Árbol, el aire es húmedo y pesa como la savia.","樹の内部は湿っていて、樹液のように重い空気が満ちている。"],"Voz da Árvore: Suba pelas câmaras, Link. Queime as teias, desperte as runas, enfrente o que me devora.":["Voice of the Tree: Climb through the chambers, Link. Burn the webs, awaken the runes, and face the thing devouring me.","Voz del Árbol: Sube por las cámaras, Link. Quema las telarañas, despierta las runas y enfréntate a lo que me devora.","樹の声：部屋を上へ進むのだ、リンク。クモの巣を燃やし、ルーンを目覚めさせ、わしを蝕むものと戦ってくれ。"],"Dica: um baú guarda o ESTILINGUE. Aperte Y (ou Q) para atirar sementes.":["Tip: a chest contains the SLINGSHOT. Press Y (or Q) to shoot seeds.","Consejo: un cofre contiene el TIRACHINAS. Pulsa Y (o Q) para lanzar semillas.","ヒント：宝箱にパチンコが入っている。Y（またはQ）でタネを撃とう。"],"Gohma tomba com um guincho e se desfaz em fuligem verde...":["Gohma collapses with a shriek and crumbles into green ash...","Gohma cae con un chillido y se deshace en ceniza verde...","ゴーマは叫び声を上げて倒れ、緑色の灰となって崩れ落ちた……"],"Grande Árvore Deku: Link... você conseguiu. Ouça enquanto ainda resta voz em minha seiva.":["Great Deku Tree: Link... you did it. Listen while there is still a voice left in my sap.","Gran Árbol Deku: Link... lo has conseguido. Escucha mientras aún me quede voz en la savia.","デクの樹：リンク……よくやった。わしの樹液にまだ声が残っているうちに聞いておくれ。"],"Grande Árvore Deku: Ganomisgan não nasceu inteiro. É um fragmento do ódio de Ganon, partido em quatro sombras. Uma delas plantou este parasita em minhas raízes.":["Great Deku Tree: Ganomisgan was not born whole. He is a fragment of Ganon's hatred, split into four shadows. One of them planted this parasite in my roots.","Gran Árbol Deku: Ganomisgan no nació completo. Es un fragmento del odio de Ganon, dividido en cuatro sombras. Una de ellas plantó este parásito en mis raíces.","デクの樹：ガノミスガンは完全な存在として生まれたのではない。ガノンの憎しみの欠片が四つの影に分かれたものだ。その一つが、わしの根にこの寄生体を植えつけた。"],"Grande Árvore Deku: Ele se alimentava da Esmeralda Kokiri e do tempo da floresta. A cura chegou tarde para este corpo.":["Great Deku Tree: It fed on the Kokiri Emerald and the forest's time. The cure came too late for this body.","Gran Árbol Deku: Se alimentaba de la Esmeralda Kokiri y del tiempo del bosque. La cura llegó demasiado tarde para este cuerpo.","デクの樹：寄生体はコキリのエメラルドと森の時を糧にしていた。この体には、癒やしが届くのが遅すぎた。"],"Grande Árvore Deku: Não chore. Uma árvore nunca morre por inteiro. Leve a Esmeralda: ela abrirá o Selo Real.":["Great Deku Tree: Do not weep. A tree never dies completely. Take the Emerald: it will open the Royal Seal.","Gran Árbol Deku: No llores. Un árbol nunca muere del todo. Llévate la Esmeralda: abrirá el Sello Real.","デクの樹：泣かないでおくれ。樹は決して完全には死なない。エメラルドを持っていくのだ。王家の印を開く鍵となる。"],"Grande Árvore Deku: Diga a Saria que a canção dela ainda ecoa em cada folha...":["Great Deku Tree: Tell Saria that her song still echoes in every leaf...","Gran Árbol Deku: Dile a Saria que su canción aún resuena en cada hoja...","デクの樹：サリアに伝えておくれ。あの子の歌は今も一枚一枚の葉に響いていると……"],"A voz some. A madeira estala. Do alto do núcleo, algo pequeno cai.":["The voice fades. The wood creaks. Something small falls from the top of the core.","La voz se desvanece. La madera cruje. Algo pequeño cae desde lo alto del núcleo.","声が消える。木がきしむ。核の上から小さな何かが落ちてくる。"],"Uma semente caiu no chão...":["A seed fell to the ground...","Una semilla cayó al suelo...","タネが地面に落ちた……"],"Gohma caiu! Ataque agora!":["Gohma has fallen! Attack now!","¡Gohma ha caído! ¡Ataca ahora!","ゴーマが落ちた！今だ、攻撃しろ！"],"A carapaça é dura! Espere-a cair.":["Its shell is tough! Wait for it to fall.","¡Su caparazón es duro! Espera a que caiga.","甲羅は硬い！落ちてくるのを待て。"],"A passagem se abriu!":["The passage has opened!","¡El pasaje se ha abierto!","通路が開いた！"],"As teias só queimam com fogo!":["The webs can only be burned with fire!","¡Las telarañas solo se queman con fuego!","クモの巣は炎でしか燃やせない！"],"O caminho se abriu!":["The path has opened!","¡El camino se ha abierto!","道が開いた！"],"Todas as runas brilham! A seiva cedeu.":["All the runes are glowing! The sap barrier has given way.","¡Todas las runas brillan! La savia ha cedido.","すべてのルーンが輝いた！樹液の封印が解けた。"],"Runa acesa! Rápido, antes que se apague.":["Rune lit! Hurry, before it goes out.","¡Runa encendida! Rápido, antes de que se apague.","ルーンが点灯した！消える前に急げ。"],"A boca da Árvore exige uma arma. Volte armado.":["The Tree's mouth demands a weapon. Return armed.","La boca del Árbol exige un arma. Vuelve armado.","樹の入り口は武器を求めている。武装して戻ろう。"],"Você recolheu a Semente da Grande Árvore Deku.":["You collected the Great Deku Tree's Seed.","Has recogido la Semilla del Gran Árbol Deku.","デクの樹のタネを手に入れた。"],"Você obteve a ESMERALDA KOKIRI! +1 coração!":["You obtained the KOKIRI EMERALD! +1 heart!","¡Obtuviste la ESMERALDA KOKIRI! ¡+1 corazón!","コキリのエメラルドを手に入れた！ハート+1！"],"O Selo Real no Castelo reconhecerá sua coragem. Três Sementes Deku foram guardadas no inventário.":["The Royal Seal at the Castle will recognize your courage. Three Deku Seeds have been placed in your inventory.","El Sello Real del Castillo reconocerá tu valor. Se han guardado tres Semillas Deku en tu inventario.","城の王家の印は、そなたの勇気を認めるだろう。デクのタネを3個インベントリに入れた。"],"Uma luz verde envolve Link e o leva para fora da Árvore...":["A green light surrounds Link and carries him out of the Tree...","Una luz verde envuelve a Link y lo saca del Árbol...","緑の光がリンクを包み、樹の外へと運んでいく……"],"Seu galho pegou fogo! Ataque (A) para queimar as teias.":["Your stick is on fire! Attack (A) to burn the webs.","¡Tu rama está ardiendo! Ataca (A) para quemar las telarañas.","枝に火がついた！攻撃（A）でクモの巣を燃やそう。"],"A Grande Árvore Deku repousa. Uma muda brota onde ficava a boca.":["The Great Deku Tree rests. A sapling sprouts where its mouth once was.","El Gran Árbol Deku descansa. Un brote nace donde antes estaba su boca.","デクの樹は静かに眠っている。かつて口があった場所から若木が芽吹いている。"],"A Floresta Kokiri vai lembrar para sempre.":["The Kokiri Forest will remember forever.","El Bosque Kokiri lo recordará para siempre.","コキリの森は、このことを永遠に忘れないだろう。"],"Eco da Árvore: As teias bloqueiam a subida.":["Echo of the Tree: The webs are blocking the way up.","Eco del Árbol: Las telarañas bloquean el ascenso.","樹のこだま：クモの巣が上への道をふさいでいる。"],"Acenda seu galho nas tochas da câmara e queime-as com um ataque.":["Light your stick at the chamber torches and burn the webs with an attack.","Enciende tu rama en las antorchas de la cámara y quema las telarañas con un ataque.","部屋のたいまつで枝に火をつけ、攻撃してクモの巣を燃やそう。"],"Eco da Árvore: Três runas guardam o selo. Duas estão altas demais...":["Echo of the Tree: Three runes protect the seal. Two are too high...","Eco del Árbol: Tres runas protegen el sello. Dos están demasiado altas...","樹のこだま：三つのルーンが封印を守っている。二つは高すぎる……"],"O Estilingue alcança o que a espada não alcança.":["The Slingshot can reach what the sword cannot.","El tirachinas alcanza lo que la espada no puede.","パチンコなら剣が届かない場所にも届く。"],"Eco da Árvore: Os Scrubs só se expõem ao atirar. Use o escudo e golpeie quando surgirem.":["Echo of the Tree: Scrubs only expose themselves when they shoot. Use your shield and strike when they emerge.","Eco del Árbol: Los Scrubs solo se exponen al disparar. Usa el escudo y golpéalos cuando aparezcan.","樹のこだま：デクナッツは攻撃するときだけ姿を現す。盾を構え、現れた瞬間に攻撃しよう。"],"Eco da Árvore: A Rainha Gohma pende do teto. Acerte o olho com uma semente quando ele brilhar vermelho...":["Echo of the Tree: Queen Gohma hangs from the ceiling. Hit her eye with a seed when it glows red...","Eco del Árbol: La Reina Gohma cuelga del techo. Golpea su ojo con una semilla cuando brille en rojo...","樹のこだま：ゴーマの女王は天井にぶら下がっている。目が赤く光ったらタネを当てよう……"],"...e golpeie-a quando cair!":["...and strike her when she falls!","...¡y golpéala cuando caiga!","……落ちてきたら攻撃しよう！"],"Você obteve o MAPA DA ÁRVORE!":["You obtained the TREE MAP!","¡Obtuviste el MAPA DEL ÁRBOL!","樹のマップを手に入れた！"],"Um mini-mapa aparece no canto da tela.":["A mini-map appears in the corner of the screen.","Aparece un minimapa en la esquina de la pantalla.","画面の隅にミニマップが表示される。"],"Aqui dentro a chuva não alcança...":["The rain cannot reach in here...","Aquí dentro no llega la lluvia...","ここまでは雨も届かない……"],"LIVRO DE CANÇÕES (B abre a Ocarina)":["SONGBOOK (B opens the Ocarina)","LIBRO DE CANCIONES (B abre la Ocarina)","歌の本（Bでオカリナを開く）"],"Vitória! Você é o campeão da Arena do Desafio!":["Victory! You are the champion of the Challenge Arena!","¡Victoria! ¡Eres el campeón de la Arena del Desafío!","勝利！チャレンジアリーナのチャンピオンだ！"],"+100 rupees e +1 coração!":["+100 rupees and +1 heart!","+100 rupias y +1 corazón!","100ルピーとハート+1！"],"Grande Fada: Herói adormecido, eu esperava por você.":["Great Fairy: Sleeping hero, I have been waiting for you.","Gran Hada: Héroe dormido, te estaba esperando.","大妖精：眠れる勇者よ、あなたを待っていました。"],"A Grande Fada cura todos os seus ferimentos. ♪":["The Great Fairy heals all your wounds. ♪","El Gran Hada cura todas tus heridas. ♪","大妖精があなたの傷をすべて癒やしてくれる。♪"],"Campeão! Ninguém na Arena ousa enfrentá-lo de novo.":["Champion! No one in the Arena dares challenge you again.","¡Campeón! Nadie en la Arena se atreve a desafiarte de nuevo.","チャンピオン！闘技場で再び君に挑もうとする者はいない。"],"Lute, herói!":["Fight, hero!","¡Lucha, héroe!","戦え、勇者よ！"],"Volte quando tiver uma arma.":["Come back when you have a weapon.","Vuelve cuando tengas un arma.","武器を手に入れたら戻ってこい。"],"Bem-vindo à Arena do Desafio! São 3 rodadas de monstros.":["Welcome to the Challenge Arena! There are 3 rounds of monsters.","¡Bienvenido a la Arena del Desafío! Hay 3 rondas de monstruos.","試練の闘技場へようこそ！モンスターとの戦いは全3ラウンドだ。"],"Vença todas e ganhe um Fragmento de Coração. Se cair, recomeça. Pronto?":["Win them all to earn a Heart Piece. If you fall, you'll start over. Ready?","Gánalas todas para conseguir un Fragmento de Corazón. Si caes, empezarás de nuevo. ¿Listo?","すべて勝ち抜けばハートのかけらが手に入る。倒れたら最初からだ。準備はいいか？"],"Agora não":["Not now","Ahora no","今はやめておく"],"Já está no máximo!":["You're already at the maximum!","¡Ya estás al máximo!","すでに最大だ！"],"Capitão do Porto: Destino?":["Harbor Captain: Destination?","Capitán del Puerto: ¿Destino?","港の船長：行き先は？"],"Domínio Zora (20 rupees)":["Zora's Domain (20 rupees)","Dominio Zora (20 rupias)","ゾーラの里（20ルピー）"],"O barco corta as águas...":["The boat cuts through the water...","El barco surca las aguas...","船が水面を切って進む……"],"Lago Hylia (grátis)":["Lake Hylia (free)","Lago Hylia (gratis)","ハイリア湖（無料）"],"Ferreiro Goron: Que a lâmina te sirva bem, herói!":["Goron Smith: May the blade serve you well, hero!","Herrero Goron: ¡Que la hoja te sirva bien, héroe!","ゴロンの鍛冶屋：その刃が役に立つことを願うぞ、勇者よ！"],"Ferreiro Goron: Pronto! Um escudo vulcânico só para você!":["Goron Smith: There! A volcanic shield, just for you!","Herrero Goron: ¡Listo! ¡Un escudo volcánico solo para ti!","ゴロンの鍛冶屋：できたぞ！お前だけの火山の盾だ！"],"Ferreiro Goron: Você já tem escudo... tome 60 rupees então!":["Goron Smith: You already have a shield... then take 60 rupees!","Herrero Goron: Ya tienes un escudo... ¡entonces toma 60 rupias!","ゴロンの鍛冶屋：もう盾を持っているのか……なら60ルピーを持っていけ！"],"Ferreiro Goron: Traga fragmentos de rocha vulcânica.":["Goron Smith: Bring me fragments of volcanic rock.","Herrero Goron: Tráeme fragmentos de roca volcánica.","ゴロンの鍛冶屋：火山岩のかけらを持ってきてくれ。"],"Você encontrou um Frasco de Coração no Porto! +1 coração.":["You found a Heart Container at the Harbor! +1 heart.","¡Encontraste un Frasco de Corazón en el Puerto! +1 corazón.","港でハートの器を見つけた！ハート+1。"],"Você encontrou o Pergaminho Goron!":["You found the Goron Scroll!","¡Encontraste el Pergamino Goron!","ゴロンの巻物を見つけた！"],"Ele diz: \"O herói que carregar a pedra do Vulcão jamais sentirá frio.\"":["It reads: \"The hero who carries the Volcano Stone will never feel cold.\"","Dice: \"El héroe que lleve la piedra del Volcán jamás sentirá frío.\"","そこにはこう書かれている：「火山の石を持つ勇者は、決して寒さを感じない。」"],"+15 rupees.":["+15 rupees.","+15 r
